<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEUFREX Snake</title><style>body{margin:0;background:#070711;color:#fff;font-family:Arial;text-align:center}main{max-width:620px;margin:auto;padding:30px 15px}canvas{background:#11152a;border:2px solid #7c5cff;border-radius:18px;max-width:100%}button{padding:12px 20px;border:0;border-radius:12px;background:#7c5cff;color:#fff;font-weight:800;cursor:pointer;margin:8px}h1{font-size:40px}#score{color:#bbb}</style></head><body><main><h1>🐍 JEUFREX Snake</h1><p id="score">Skor: 0</p><canvas id="c" width="500" height="500"></canvas><br><button onclick="start()">▶ Başlat / Yeniden Başlat</button><button onclick="location.href='games.html'">← Oyunlara dön</button></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=25,S=20;let snake,food,dx,dy,score,timer;function start(){snake=[{x:12,y:12}];dx=1;dy=0;score=0;food=F();clearInterval(timer);timer=setInterval(tick,100);draw()}function F(){let f;do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake&&snake.some(a=>a.x==f.x&&a.y==f.y));return f}document.onkeydown=e=>{if(e.key=='ArrowUp'&&dy!==1){dx=0;dy=-1}if(e.key=='ArrowDown'&&dy!==-1){dx=0;dy=1}if(e.key=='ArrowLeft'&&dx!==1){dx=-1;dy=0}if(e.key=='ArrowRight'&&dx!==-1){dx=1;dy=0}};function tick(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(a=>a.x==h.x&&a.y==h.y)){clearInterval(timer);alert('Oyun bitti! Skor: '+score);return}snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;food=F()}else snake.pop();document.getElementById('score').textContent='Skor: '+score;draw()}function draw(){x.clearRect(0,0,500,500);x.fillStyle='#ff4d91';x.fillRect(food.x*S+3,food.y*S+3,14,14);snake.forEach((a,i)=>{x.fillStyle=i?'#7c5cff':'#fff';x.fillRect(a.x*S+2,a.y*S+2,16,16)})}start()</script></body></html>
