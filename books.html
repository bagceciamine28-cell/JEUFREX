<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitaplar | JEUFREX</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,Arial,sans-serif;background:#060611;min-height:100vh}body:before{content:"";position:fixed;inset:-30%;z-index:-1;background:radial-gradient(circle at 15% 20%,#7658ff55,transparent 25%),radial-gradient(circle at 80% 25%,#ff4d9150,transparent 25%),radial-gradient(circle at 50% 90%,#4de7ff25,transparent 25%);filter:blur(14px);animation:bg 16s ease-in-out infinite alternate}@keyframes bg{to{transform:translate(7%,5%) scale(1.1)}}header{position:sticky;top:0;z-index:40;padding:16px 35px;display:flex;justify-content:space-between;align-items:center;background:#070711e8;border-bottom:1px solid #ffffff12;backdrop-filter:blur(24px)}.logo{color:#fff;text-decoration:none;font-size:25px;font-weight:950}nav{display:flex;gap:18px}nav a{color:#aaa;text-decoration:none;font-size:13px;font-weight:800}nav a:hover,nav a.active{color:#fff}main{width:min(1160px,calc(100% - 30px));margin:auto;padding:42px 0 90px}.hero,.book{background:linear-gradient(145deg,#ffffff12,#ffffff05);border:1px solid #ffffff14;backdrop-filter:blur(22px);box-shadow:0 25px 80px #0007}.hero{padding:48px;border-radius:34px;animation:up .6s ease}.hero h1{font-size:clamp(45px,7vw,78px);margin:18px 0 10px;letter-spacing:-4px;background:linear-gradient(90deg,#fff,#d8d0ff,#ff9fc3);-webkit-background-clip:text;color:transparent}.hero p{max-width:720px;color:#aaa;line-height:1.7}.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:#ffffff0c;border:1px solid #ffffff15;font-size:11px;font-weight:900}.tools{display:flex;gap:10px;margin:25px 0 15px}.search{flex:1;padding:14px 17px;border-radius:15px;border:1px solid #ffffff14;background:#ffffff09;color:#fff;outline:none}.filter{padding:0 15px;border-radius:14px;border:1px solid #ffffff14;background:#ffffff09;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.book{padding:18px;border-radius:26px;transition:.3s;animation:up .5s ease both}.book:hover{transform:translateY(-8px);box-shadow:0 28px 70px #0009}.cover{height:220px;border-radius:19px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:20px;box-shadow:0 18px 45px #0009}.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#fff3,transparent 35%,transparent 65%,#0009)}.cover-art{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;filter:drop-shadow(0 15px 20px #0009)}.cover-title{position:relative;z-index:2;font:900 23px Georgia,serif;text-shadow:0 3px 15px #000}.book h3{margin:15px 0 5px}.book p{margin:0;color:#888;font-size:12px;line-height:1.55}.meta{display:flex;justify-content:space-between;color:#666;font-size:10px;margin-top:13px}.open{margin-top:13px;padding:9px 13px;border:1px solid #ffffff12;border-radius:11px;background:#ffffff09;color:#fff;font-weight:900;cursor:pointer}.reader{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:15px;background:#000b;backdrop-filter:blur(18px)}.reader.show{display:grid}.reader-box{width:min(920px,100%);height:min(720px,94vh);display:flex;flex-direction:column;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,#1b1b2a,#0b0b13);border:1px solid #ffffff18;box-shadow:0 40px 120px #000d}.reader-top{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid #ffffff10}.reader-title{font:900 18px Georgia,serif}.reader-sub{color:#777;font-size:11px;margin-top:4px}.close{border:0;background:#ffffff0b;color:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer}.stage{flex:1;display:grid;place-items:center;padding:25px;perspective:1400px}.page{width:min(650px,100%);height:min(470px,100%);padding:45px 55px;position:relative;overflow:auto;color:#29231d;background:linear-gradient(135deg,#fffdf5,#f0e6d0);font-family:Georgia,serif;box-shadow:0 25px 65px #000a;border-radius:5px;transform-origin:left center}.page h2{text-align:center;font-size:28px;margin:0 0 22px}.page p{font-size:18px;line-height:1.9;text-align:justify;margin:0}.page-no{position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#8a7b67;font-size:12px}.flip-next{animation:flipN .45s ease}.flip-prev{animation:flipP .45s ease}@keyframes flipN{50%{transform:rotateY(-85deg);opacity:.2}}@keyframes flipP{50%{transform:rotateY(85deg);opacity:.2}}.controls{display:flex;justify-content:center;gap:12px;padding:15px;border-top:1px solid #ffffff10}.controls button{padding:11px 18px;border:0;border-radius:13px;background:#ffffff0b;color:#fff;font-weight:900;cursor:pointer}.controls .primary{background:linear-gradient(135deg,#7c5cff,#ff4d91)}.reader-progress{width:min(500px,70vw);margin:0 auto 14px;accent-color:#fff}.empty{text-align:center;padding:40px;color:#888;grid-column:1/-1}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){header{padding:13px 16px}nav{display:none}.hero{padding:30px 22px}.grid{grid-template-columns:1fr}.tools{flex-direction:column}.filter{padding:12px}.page{padding:32px 27px;max-height:430px}.page p{font-size:16px;line-height:1.75}.stage{padding:15px}.reader-box{height:96vh}}</style></head><body><header><a class="logo" href="index.html">JEUFREX</a><nav><a href="index.html">Ana Sayfa</a><a href="games.html">🎮 Oyunlar</a><a href="music.html">🎵 Müzik</a><a href="videos.html">🎬 Videolar</a><a href="community.html">👥 Topluluk</a><a class="active" href="books.html">📚 Kitaplar</a><a href="explore.html">✨ Keşfet</a><a href="jeo.html">🤖 JEO AI</a></nav></header><main><section class="hero"><span class="badge">📚 JEUFREX BOOKS</span><h1>Hikâyeler burada başlar.</h1><p>10 özgün seri, farklı türler, bölüm bölüm yayın ve her bölümde 50 sayfa. Yeni bölümler yakında gelecek; okuma deneyimi sayfa çevirme animasyonuyla devam ediyor.</p></section><section><div class="tools"><input id="search" class="search" placeholder="🔎 Kitap, yazar veya tür ara..."><select id="filter" class="filter"><option value="all">Tüm türler</option><option>Macera</option><option>Fantastik</option><option>Bilim Kurgu</option><option>Gizem</option><option>Dram</option><option>K-Drama</option><option>Korku / Gerilim</option><option>Türk Komedi</option><option>Spor</option><option>Tarih</option><option>Günlük Yaşam</option></select></div><div id="grid" class="grid"></div></section></main><div id="reader" class="reader"><div class="reader-box"><div class="reader-top"><div><div id="readerTitle" class="reader-title"></div><div id="readerSub" class="reader-sub"></div></div><button class="close" onclick="closeReader()">✕</button></div><div class="stage"><article id="page" class="page"></article></div><div class="controls"><button onclick="previousPage()">← Önceki</button><button class="primary" onclick="nextPage()">Sonraki →</button></div><input id="readerProgress" class="reader-progress" type="range" min="1" max="1" value="1"></div></div><script>
const books=[
{title:'Yıldızların Ardında',genre:'Bilim Kurgu',author:'JEUFREX Originals',cover:'🚀',colors:['#10183b','#5747b8'],desc:'Uzak bir istasyonda başlayan keşif, bilinmeyen bir dünyanın kapısını açıyor.',pages:[['Sessizlik','İstasyondaki saat 03.17’yi gösterdiğinde bütün ışıklar aynı anda söndü. Mira camın ardındaki yıldızlara baktı. Dünya’dan milyonlarca kilometre uzakta, karanlığın içinde tek bir ışık yanıp sönüyordu.'],['Sinyal','Sinyal üç kez tekrarlandı. Mira bilgisayarın başına geçti ve frekansı kaydetti. Bu doğal bir yıldız patlaması değildi. Birisi, bir yerden onlara mesaj gönderiyordu.'],['Kapı','Haritanın gösterdiği koordinat istasyonun hemen dışındaydı. Uzay boşluğunda duran metalik bir kapı vardı. Mira elini yaklaştırınca üzerinde küçük bir sembol parladı.'],['Geçit','Kapı açıldığında karşısında yıldızlarla dolu bir koridor belirdi. Koridorun sonunda mavi bir gezegen görünüyordu. İnsanlığın evreni sandığından çok daha büyük olduğunu ilk kez hissetti.'],['Seçim','Uyarılar arka arkaya çalmaya başladı. Mira’nın önünde iki seçenek vardı: kapıyı kapatıp eve dönmek ya da bilinmeyen dünyaya ilk adımı atmak. Derin bir nefes aldı.'],['Son','Bir adım attı. Kapı arkasında sessizce kapandı. Uzakta yeni bir güneş doğuyordu. Mira gülümsedi; çünkü bazı hikâyeler eve dönmekle değil, bilinmeyene yürümekle başlardı.']]},
{title:'Kayıp Haritanın Sırrı',genre:'Macera',author:'JEUFREX Originals',cover:'🗺️',colors:['#172b1d','#a27632'],desc:'Eski bir harita, üç ipucu ve kimsenin gitmeye cesaret edemediği bir yer.',pages:[['Harita','Dedelerinden kalan sandığın dibinde eski bir harita vardı. Köşesinde üç kelime yazıyordu: Kuzeye git. Sessiz kal. Bekle.'],['İlk İpucu','Ormandaki yaşlı taşın üzerinde aynı sembolü gördüler. Taşın altında küçük bir pusula vardı. İbre gizli bir geçidi gösteriyordu.'],['Mağara','Dar geçit geniş bir mağaraya açıldı. Duvarlardaki işaretler haritanın parçalarıyla birleşince gizli yol ortaya çıktı.'],['Kasa','Kayanın arkasında küçük bir kasa buldular. İçinde altın değil, bölgenin geçmişini anlatan eski bir günlük vardı. Asıl hazine unutulmuş bir hikâyeydi.'],['Son','Haritayı tekrar katladılar. Artık onun yalnızca bir yol göstermediğini biliyorlardı. Harita, geçmişin izlerini geleceğe taşıyan bir anahtardı.']]},
{title:'Ay Işığındaki Şehir',genre:'Fantastik',author:'JEUFREX Originals',cover:'🌙',colors:['#24152f','#8a3fa4'],desc:'Geceleri ortaya çıkan şehirde her sokak başka bir hikâyeye açılıyor.',pages:[['Şehir','Şehir yalnızca ay tam yükseldiğinde görünüyordu. Pencerelerde altın ışıklar yanıyor, taş sokaklarda kimsenin bilmediği şarkılar yankılanıyordu.'],['Saatçi','Meydandaki saatçi, şehrin her gece yeniden kurulduğunu söyledi. Bir sonraki gün hiçbir şey hatırlanmayacaktı. Fakat bir kişi hatırlamaya devam edecekti.'],['Anahtar','Eski bir anahtar, şehrin merkezindeki kapıyı açtı. Kapının ardında sonsuz kitapların bulunduğu bir kütüphane vardı. Her kitap birinin hikâyesiydi.'],['Son','Sabah olduğunda şehir kayboldu. Fakat anahtar cebinde kalmıştı. Ay yeniden yükseldiğinde geri dönebileceğini artık biliyordu.']]},
{title:'Saat 00:00',genre:'Gizem',author:'JEUFREX Originals',cover:'🕛',colors:['#261716','#9b3c55'],desc:'Her gece aynı saatte duran saat, çözülmemiş bir olayın izlerini gösteriyor.',pages:[['Saat','Evdeki eski saat yıllardır çalışmıyordu. Fakat o gece tam 00:00’da yeniden çalmaya başladı. Akrep ve yelkovan hareket etmiyor, yalnızca gölge değişiyordu.'],['İz','Duvarın arkasında eski bir fotoğraf bulundu. Fotoğraftaki saat de tam 00:00’ı gösteriyordu. O an evin geçmişinin sandığından daha karmaşık olduğunu anladı.'],['Son','Saat üçüncü kez çaldığında gölge kayboldu. Masanın üzerinde tek bir not vardı: “Bazı sırlar bulunmak için değil, anlaşılmak için saklanır.”']]},
{title:'Son Mektup',genre:'Dram',author:'JEUFREX Originals',cover:'✉️',colors:['#37251b','#b16b43'],desc:'Yıllar sonra bulunan bir mektup, unutulduğu sanılan bir hikâyeyi yeniden başlatıyor.',pages:[['Mektup','Kutunun içindeki mektup yıllardır açılmamıştı. Kâğıdın üzerinde solmuş bir tarih vardı. Okudukça geçmişte yarım kalan bir konuşmanın izlerini buldu.'],['Hatıra','Her cümle eski bir günü hatırlatıyordu. İnsan bazen geçmişi değiştiremezdi ama onunla barışmayı öğrenebilirdi.'],['Son','Mektubu yeniden katladı ve kutuya koymadı. Bu kez masanın üzerine bıraktı. Çünkü bazı vedalar ancak sonunda okunabildiğinde tamamlanır.']]},
{title:'Bulutların Üzerindeki Ev',genre:'Fantastik',author:'JEUFREX Originals',cover:'🏠',colors:['#102c3b','#357d91'],desc:'Gökyüzünde yaşayan küçük bir evin kapısı yalnızca cesur olanlara açılıyor.',pages:[['Ev','Bulutların üzerinde küçük bir ev vardı. Kapısı yalnızca korkusunu kabul edenlere açılırdı.'],['Cesaret','Kapının önünde uzun süre bekledi. Sonunda korkusunu saklamak yerine onunla konuştu. Kapı yavaşça açıldı.'],['Son','Evin içinden bütün dünyanın manzarası görünüyordu. Artık cesaretin korkusuz olmak değil, korkuya rağmen ilerlemek olduğunu biliyordu.']]}
];
const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter'),reader=document.getElementById('reader'),page=document.getElementById('page'),slider=document.getElementById('readerProgress');let bi=0,pi=0,busy=false;
function render(){const q=search.value.toLowerCase().trim(),g=filter.value;const data=books.map((b,i)=>({...b,i})).filter(b=>(g==='all'||b.genre===g)&&(!q||(b.title+' '+b.genre+' '+b.author).toLowerCase().includes(q)));grid.innerHTML=data.length?data.map((b,i)=>`<article class="book" style="animation-delay:${i*60}ms"><div class="cover" style="background:linear-gradient(135deg,${b.colors[0]},${b.colors[1]})"><div class="cover-art">${b.cover}</div><div class="cover-title">${b.title}</div></div><h3>${b.title}</h3><p>${b.desc}</p><div class="meta"><span>${b.genre}</span><span>${b.pages.length} sayfa</span></div><button class="open" onclick="openBook(${b.i})">📖 Kitabı oku</button></article>`).join(''):'<div class="empty">📚 Kitap bulunamadı.</div>'}
function draw(){const b=books[bi],p=b.pages[pi];page.innerHTML=`<h2>${p[0]}</h2><p>${p[1]}</p><div class="page-no">${pi+1} / ${b.pages.length}</div>`;document.getElementById('readerTitle').textContent=b.title;document.getElementById('readerSub').textContent=b.author+' • '+b.genre;slider.max=b.pages.length;slider.value=pi+1}
function openBook(i){bi=i;pi=0;reader.classList.add('show');document.body.style.overflow='hidden';draw()}
function closeReader(){reader.classList.remove('show');document.body.style.overflow=''}
function turn(dir){if(busy)return;const target=pi+dir;if(target<0||target>=books[bi].pages.length)return;busy=true;page.classList.remove('flip-next','flip-prev');void page.offsetWidth;page.classList.add(dir>0?'flip-next':'flip-prev');setTimeout(()=>{pi=target;draw();busy=false},220)}
function nextPage(){turn(1)}function previousPage(){turn(-1)}
slider.oninput=()=>{pi=Number(slider.value)-1;draw()};search.oninput=render;filter.onchange=render;reader.onclick=e=>{if(e.target===reader)closeReader()};document.addEventListener('keydown',e=>{if(!reader.classList.contains('show'))return;if(e.key==='Escape')closeReader();if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')previousPage()});let sx=0;page.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});page.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>45)dx<0?nextPage():previousPage()},{passive:true});render();
</script><script src="books10.js"></script><script src="books10-ui.js"></script></body></html>
