<script>

const MUSIC_JSON =
  "music-list.json";

const musicList =
  document.getElementById("musicList");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

let allMusic = [];

let players = [];


/* ==========================================
   BAŞLIK TEMİZLE
========================================== */

function cleanTitle(filename) {

  return filename
    .replace(/\.mp3$/i, "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* ==========================================
   KART
========================================== */

function createMusicCard(file) {

  const card =
    document.createElement("article");

  card.className =
    "music-card";

  const cover =
    document.createElement("div");

  cover.className =
    "cover";

  cover.textContent =
    "🎵";


  const info =
    document.createElement("div");

  info.className =
    "music-info";


  const title =
    document.createElement("h2");

  title.textContent =
    cleanTitle(file.name);


  const artist =
    document.createElement("div");

  artist.className =
    "artist";

  artist.textContent =
    "JEUFREX • Admin Originals";


  const audio =
    document.createElement("audio");

  audio.controls =
    true;

  audio.preload =
    "metadata";

  audio.src =
    file.path;


  const original =
    document.createElement("span");

  original.className =
    "original";

  original.textContent =
    "🎧 ADMIN ORIGINAL";


  info.appendChild(title);

  info.appendChild(artist);

  info.appendChild(audio);

  info.appendChild(original);

  card.appendChild(cover);

  card.appendChild(info);

  return card;

}


/* ==========================================
   LİSTELE
========================================== */

function renderMusic(list) {

  musicList.innerHTML =
    "";

  count.textContent =
    list.length;


  if (!list.length) {

    musicList.innerHTML = `

      <div class="empty">
        🔍 Bu isimde müzik bulunamadı.
      </div>

    `;

    return;

  }


  list.forEach(file => {

    musicList.appendChild(
      createMusicCard(file)
    );

  });


  players =
    document.querySelectorAll("audio");


  players.forEach(player => {

    player.addEventListener(
      "play",
      () => {

        players.forEach(other => {

          if (
            other !== player
          ) {

            other.pause();

          }

        });

      }
    );

  });

}


/* ==========================================
   MÜZİKLERİ AL
========================================== */

async function loadMusic() {

  try {

    const response =
      await fetch(
        MUSIC_JSON + "?v=" + Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "music-list.json bulunamadı."
      );

    }


    const data =
      await response.json();


    allMusic =
      data.filter(
        file =>
          /\.mp3$/i.test(file.name)
      );


    allMusic.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name,
          "tr"
        )
    );


    renderMusic(
      allMusic
    );

  }

  catch(error) {

    console.error(error);

    musicList.innerHTML = `

      <div class="error">

        ❌ Müzikler yüklenemedi.

        <br><br>

        <small>
          ${error.message}
        </small>

      </div>

    `;

  }

}


/* ==========================================
   ARAMA
========================================== */

search.addEventListener(
  "input",
  () => {

    const query =
      search.value
        .toLowerCase()
        .trim();


    const filtered =
      allMusic.filter(
        file =>
          cleanTitle(file.name)
            .toLowerCase()
            .includes(query)
      );


    renderMusic(
      filtered
    );

  }
);


/* ==========================================
   BAŞLAT
========================================== */

loadMusic();

</script>
