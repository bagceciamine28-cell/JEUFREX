      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  <section class="hero">

      dinle ve JEUFREX'te kendi müzik arşivini oluştur.
    </p>

    <div class="artist">

      <div class="artist-avatar">

  ></section>

    alt=""
  >

  <div class="player-info">

      id="playerTitle"
      class="player-title"
    >

<audio id="audio"></audio>


<script>

  /*
   * =====================================
   * ADMIN ORIGINALS
   * =====================================
   *
   * BURAYA MÜZİK EKLEYECEKSİN.
   *
   * ÖRNEK:
   *
   * {
   *   title: "Benim Şarkım",
   *   artist: "Admin Originals",
   *   file: "music/benim-sarkim.mp3",
   *   cover: "music/benim-sarkim.jpg"
   * }
   *
   */


  const songs = [

    {
      title: "İlk Şarkım",
      artist: "Admin Originals",
      file: "music/sarki1.mp3",
      cover: "music/sarki1.jpg"
    },

    {
      title: "İkinci Şarkım",
      artist: "Admin Originals",
      file: "music/sarki2.mp3",
      cover: "music/sarki2.jpg"
    },

    {
      title: "Üçüncü Şarkım",
      artist: "Admin Originals",
      file: "music/sarki3.mp3",
      cover: "music/sarki3.jpg"
    }

  ];


  const songsContainer =
    document.getElementById("songs");

  const audio =
    document.getElementById("audio");

  const playButton =
    document.getElementById("playButton");

  const prevButton =
    document.getElementById("prevButton");

  const nextButton =
    document.getElementById("nextButton");

  const progress =
    document.getElementById("progress");

  const volume =
    document.getElementById("volume");

  const playerTitle =
    document.getElementById("playerTitle");

  const playerArtist =
    document.getElementById("playerArtist");

  const playerCover =
    document.getElementById("playerCover");


  let currentIndex = -1;


  function renderSongs() {

    songsContainer.innerHTML = "";


    if (!songs.length) {

      songsContainer.innerHTML =
        `
        <div class="empty">
          Henüz müzik eklenmemiş. 🎵
        </div>
        `;

      return;
    }


    songs.forEach(
      (song, index) => {

        const element =
          document.createElement("div");

        element.className = "song";


        element.innerHTML = `

          <img
            class="cover"
            src="${song.cover}"
            alt=""
            onerror="
              this.src =
              'data:image/svg+xml,' +
              encodeURIComponent(
                '<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;300&quot; height=&quot;300&quot;><rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;%23111122&quot;/><text x=&quot;50%&quot; y=&quot;55%&quot; fill=&quot;white&quot; font-size=&quot;80&quot; text-anchor=&quot;middle&quot;>♪</text></svg>'
              );
            "
          >

          <div class="song-info">

            <div class="song-title">
              ${song.title}
            </div>

            <div class="song-artist">
              ${song.artist}
            </div>

          </div>

          <button
            class="play"
            onclick="playSong(${index})"
          >
            ▶
          </button>

        `;


        songsContainer.appendChild(
          element
        );

      }
    );

  }


  function playSong(index) {

    if (
      index < 0 ||
      index >= songs.length
    ) {
      return;
    }


    currentIndex = index;

    const song =
      songs[index];


    audio.src =
      song.file;


    playerTitle.textContent =
      song.title;


    playerArtist.textContent =
      song.artist;


    playerCover.src =
      song.cover;


    audio.play()
      .then(() => {

        playButton.textContent =
          "⏸";

      })
      .catch(() => {

        playButton.textContent =
          "▶";

        alert(
          "Müzik dosyası bulunamadı veya tarayıcı oynatmayı engelledi."
        );

      });

  }


  playButton.onclick =
    function() {

      if (currentIndex === -1) {

        playSong(0);

        return;
      }


      if (audio.paused) {

        audio.play();

        playButton.textContent =
          "⏸";

      }

      else {

        audio.pause();

        playButton.textContent =
          "▶";

      }

    };


  prevButton.onclick =
    function() {

      if (!songs.length) return;

      let index =
        currentIndex - 1;

      if (index < 0) {
        index = songs.length - 1;
      }

      playSong(index);

    };


  nextButton.onclick =
    function() {

      if (!songs.length) return;

      let index =
        currentIndex + 1;

      if (index >= songs.length) {
        index = 0;
      }

      playSong(index);

    };


  audio.addEventListener(
    "ended",
    function() {

      if (!songs.length) return;

      let index =
        currentIndex + 1;

      if (index >= songs.length) {
        index = 0;
      }

      playSong(index);

    }
  );


  audio.addEventListener(
    "timeupdate",
    function() {

      if (!audio.duration) return;

      progress.value =
        (audio.currentTime /
        audio.duration) * 100;

    }
  );


  progress.addEventListener(
    "input",
    function() {

      if (!audio.duration) return;

      audio.currentTime =
        (progress.value / 100) *
        audio.duration;

    }
  );


  volume.addEventListener(
    "input",
    function() {

      audio.volume =
        volume.value;

    }
  );


  audio.addEventListener(
    "play",
    function() {

      playButton.textContent =
        "⏸";

    }
  );


  audio.addEventListener(
    "pause",
    function() {

      playButton.textContent =
        "▶";

    }
  );


  renderSongs();

</script>

</body>
</html>
