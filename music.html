<script>


// ==================================================
// JEUFREX GITHUB REPOSITORY
// ==================================================

const GITHUB_OWNER =
  "bagceciamine28-cell";

const GITHUB_REPO =
  "JEUFREX";

const MUSIC_FOLDER =
  "music";


// ==================================================
// DOSYA ADINI BAŞLIĞA ÇEVİR
// ==================================================

function cleanTitle(filename) {

  return filename
    .replace(/\.mp3$/i, "")
    .replace(/[_-]+/g, " ")
    .trim();

}


// ==================================================
// MÜZİK KARTI OLUŞTUR
// ==================================================

function createMusicCard(file) {

  const card =
    document.createElement("article");

  card.className =
    "music-card";


  const cover =
    document.createElement("div");

  cover.className =
    "cover";

  cover.textContent =
    "🎵";


  const info =
    document.createElement("div");

  info.className =
    "music-info";


  const title =
    document.createElement("h2");

  title.textContent =
    cleanTitle(file.name);


  const artist =
    document.createElement("div");

  artist.className =
    "artist";

  artist.textContent =
    "JEUFREX • Admin Originals";


  const audio =
    document.createElement("audio");

  audio.controls =
    true;

  audio.preload =
    "metadata";

  audio.src =
    file.download_url;


  const original =
    document.createElement("span");

  original.className =
    "original";

  original.textContent =
    "🎧 ADMIN ORIGINAL";


  info.appendChild(title);

  info.appendChild(artist);

  info.appendChild(audio);

  info.appendChild(original);


  card.appendChild(cover);

  card.appendChild(info);


  return card;

}


// ==================================================
// GITHUB'TAN MÜZİKLERİ AL
// ==================================================

async function loadMusic() {

  const musicList =
    document.getElementById(
      "musicList"
    );


  try {

    const apiUrl =
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MUSIC_FOLDER}`;


    const response =
      await fetch(apiUrl);


    if (!response.ok) {

      throw new Error(
        `GitHub API hatası: ${response.status}`
      );

    }


    const files =
      await response.json();


    const musicFiles =
      files.filter(
        file =>
          file.type === "file" &&
          /\.mp3$/i.test(
            file.name
          )
      );


    if (
      musicFiles.length === 0
    ) {

      musicList.innerHTML = `

        <div class="loading">

          🎵 Henüz müzik eklenmemiş.

        </div>

      `;

      return;

    }


    // Alfabetik sıralama

    musicFiles.sort(
      (a, b) =>
        a.name.localeCompare(
          b.name,
          "tr"
        )
    );


    musicList.innerHTML =
      "";


    musicFiles.forEach(
      file => {

        musicList.appendChild(
          createMusicCard(file)
        );

      }
    );


    // ==================================================
    // AYNI ANDA SADECE 1 ŞARKI ÇALSIN
    // ==================================================

    const players =
      document.querySelectorAll(
        "audio"
      );


    players.forEach(
      player => {

        player.addEventListener(
          "play",
          () => {

            players.forEach(
              other => {

                if (
                  other !== player
                ) {

                  other.pause();

                }

              }
            );

          }
        );

      }
    );


  }
  catch (error) {

    console.error(
      "Müzik yükleme hatası:",
      error
    );


    musicList.innerHTML = `

      <div class="error">

        ❌ Müzikler yüklenemedi.

        <br><br>

        <small>
          ${error.message}
        </small>

      </div>

    `;

  }

}


// ==================================================
// BAŞLAT
// ==================================================

loadMusic();

</script>
