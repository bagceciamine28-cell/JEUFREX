<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Shift | JEUFREX</title><style>body{margin:0;background:#090812;color:#fff;font:16px Arial;text-align:center}main{max-width:650px;margin:35px auto;padding:20px}.box{height:420px;border-radius:25px;background:#151326;position:relative;overflow:hidden}.dot{position:absolute;width:42px;height:42px;border-radius:50%;background:#ff5ba9;box-shadow:0 0 30px #ff5ba9;cursor:pointer}.b{padding:12px 20px;border:0;border-radius:12px;font-weight:bold;margin:15px}</style><main><h1>🌑 Shadow Shift</h1><p>Gölgeyi yakala. Her turda hedef başka yerde!</p><div id="box" class="box"></div><p id="s">Skor: 0</p><button class="b" onclick="start()">Başlat</button></main><script>let box=document.querySelector('#box'),s=document.querySelector('#s'),score=0,t;function start(){score=0;s.textContent='Skor: 0';next()}function next(){box.innerHTML='';let d=document.createElement('div');d.className='dot';d.style.left=Math.random()*88+'%';d.style.top=Math.random()*88+'%';box.append(d);t=setTimeout(()=>{box.innerHTML='<h2 style="padding-top:180px">Kaçtı! 😵</h2>'},1300);d.onclick=()=>{clearTimeout(t);score++;s.textContent='Skor: '+score;next()}} </script>
