name: Add profile followers lists

on:
  push:
    branches: [main]
    paths:
      - profile-followers-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add followers/following UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('profile.html')
          s = p.read_text(encoding='utf-8')
          if 'profile-follow-list-v1' not in s:
              snippet = r'''<!-- profile-follow-list-v1 -->
<style>
.follow-modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;background:#000b;backdrop-filter:blur(18px)}
.follow-modal.show{display:grid;animation:followFade .2s ease}
.follow-box{width:min(520px,100%);max-height:min(720px,88vh);display:flex;flex-direction:column;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(145deg,#1b1b2a,#0d0d17);box-shadow:0 35px 100px #000a;overflow:hidden;animation:followPop .28s ease}
.follow-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid #ffffff10}
.follow-head h2{margin:0;font-size:20px}.follow-close{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff0b;color:#fff;font-size:18px;cursor:pointer}.follow-list{padding:12px;overflow:auto}.follow-user{display:flex;align-items:center;gap:13px;padding:13px;border-radius:17px;color:#fff;text-decoration:none;transition:.22s;border:1px solid transparent}.follow-user:hover{background:#ffffff0b;border-color:#ffffff12;transform:translateX(3px)}.follow-avatar{width:50px;height:50px;flex:0 0 50px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#7c5cff,#ff4d91);font-weight:950;font-size:18px}.follow-avatar img{width:100%;height:100%;object-fit:cover}.follow-info{min-width:0}.follow-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.follow-username{margin-top:3px;color:#888;font-size:12px}.follow-empty,.follow-loading{padding:45px 20px;text-align:center;color:#888}.follow-error{padding:25px;color:#ffb5b5;text-align:center}.stat{cursor:pointer}.stat:focus-visible{outline:2px solid #7c5cff;outline-offset:2px}
@keyframes followFade{from{opacity:0}}@keyframes followPop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
</style>
<div id="followModal" class="follow-modal" aria-hidden="true"><div class="follow-box"><div class="follow-head"><h2 id="followTitle">Takipçiler</h2><button id="followClose" class="follow-close" aria-label="Kapat">✕</button></div><div id="followList" class="follow-list"><div class="follow-loading">🔄 Yükleniyor...</div></div></div></div>
<script>
(function(){
  const modal=document.getElementById('followModal'), list=document.getElementById('followList'), heading=document.getElementById('followTitle'), close=document.getElementById('followClose');
  const followersStat=document.getElementById('followersCount')?.closest('.stat'), followingStat=document.getElementById('followingCount')?.closest('.stat');
  if(!modal||!list||!heading||!followersStat||!followingStat||typeof db==='undefined') return;
  const safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
  function open(title){heading.textContent=title;list.innerHTML='<div class="follow-loading">🔄 Liste yükleniyor...</div>';modal.classList.add('show');modal.setAttribute('aria-hidden','false');}
  function closeModal(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true');}
  async function load(type){
    open(type==='followers'?'👥 Takipçiler':'👤 Takip Edilenler');
    if(!currentProfile?.id){list.innerHTML='<div class="follow-error">Profil bilgisi bulunamadı.</div>';return;}
    const col=type==='followers'?'following_id':'follower_id';
    const other=type==='followers'?'follower_id':'following_id';
    const {data:rows,error}=await db.from('follows').select(`id,${other}`).eq(col,currentProfile.id);
    if(error){console.error(error);list.innerHTML='<div class="follow-error">Liste yüklenemedi.<br><small>'+safe(error.message)+'</small></div>';return;}
    const ids=(rows||[]).map(x=>x[other]).filter(Boolean);
    if(!ids.length){list.innerHTML='<div class="follow-empty">'+(type==='followers'?'Henüz takipçin yok.':'Henüz takip ettiğin kimse yok.')+'</div>';return;}
    const {data:profiles,error:pe}=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);
    if(pe){console.error(pe);list.innerHTML='<div class="follow-error">Kullanıcılar yüklenemedi.<br><small>'+safe(pe.message)+'</small></div>';return;}
    const map=new Map((profiles||[]).map(x=>[x.id,x]));
    const ordered=ids.map(id=>map.get(id)).filter(Boolean);
    list.innerHTML='';
    ordered.forEach(p=>{
      const a=document.createElement('a'); a.className='follow-user'; a.href='profile.html?user='+encodeURIComponent(String(p.username||'').replace(/^@/,''));
      const av=document.createElement('div');av.className='follow-avatar';
      if(p.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt='';img.onerror=()=>{av.textContent=(p.display_name||p.username||'?').charAt(0).toUpperCase()};av.appendChild(img)}else av.textContent=(p.display_name||p.username||'?').charAt(0).toUpperCase();
      const info=document.createElement('div');info.className='follow-info';info.innerHTML='<div class="follow-name">'+safe(p.display_name||p.username||'Kullanıcı')+'</div><div class="follow-username">'+safe(p.username?('@'+String(p.username).replace(/^@/,'')):'@kullanici')+'</div>';
      a.append(av,info);list.appendChild(a);
    });
  }
  followersStat.addEventListener('click',()=>load('followers'));followingStat.addEventListener('click',()=>load('following'));
  followersStat.setAttribute('role','button');followingStat.setAttribute('role','button');followersStat.setAttribute('tabindex','0');followingStat.setAttribute('tabindex','0');
  followersStat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')load('followers')});followingStat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')load('following')});
  close.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
})();
</script>
'''
              s=s.replace('</body>', snippet+'</body>')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.html
          git diff --cached --quiet && exit 0
          git commit -m "Add followers and following profile lists"
          git push
