```yaml
name: Update Music List

on:
  push:
    paths:
      - "music/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-music:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create music list
        shell: python
        run: |
          import json
          import os

          folder = "music"
          output = "music-list.json"

          songs = []

          if os.path.isdir(folder):
              for filename in os.listdir(folder):
                  if filename.lower().endswith(".mp3"):
                      songs.append({
                          "name": filename,
                          "path": "music/" + filename
                      })

          songs.sort(
              key=lambda x: x["name"].lower()
          )

          with open(
              output,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  songs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"{len(songs)} music files found.")

      - name: Commit music list
        run: |
          git config user.name "JEUFREX Music Bot"
          git config user.email "actions@github.com"

          git add music-list.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update music list"
            git push
          fi
```
