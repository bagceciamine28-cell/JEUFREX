<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Lab | JEUFREX</title><style>body{margin:0;background:#080814;color:#fff;font:16px Arial;text-align:center}main{max-width:700px;margin:40px auto;padding:25px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.p{height:100px;border:0;border-radius:22px;background:#181833;color:#fff;font-size:30px;cursor:pointer}.on{transform:scale(.94);background:#ff5bb1}.btn{margin:20px;padding:12px 20px;border:0;border-radius:12px;font-weight:bold}</style><main><h1>🔊 Echo Lab</h1><p>Yanan ışıkların sırasını hatırla.</p><div id="pad" class="pad"></div><p id="info">Başlat'a bas.</p><button class="btn" onclick="start()">Başlat</button></main><script>let seq=[],pos=0,playing=false;const info=document.querySelector('#info'),pad=document.querySelector('#pad');for(let i=0;i<9;i++){let b=document.createElement('button');b.className='p';b.textContent=i+1;b.onclick=()=>click(i);pad.append(b)}function flash(i){let b=pad.children[i];b.classList.add('on');setTimeout(()=>b.classList.remove('on'),300)}function start(){seq=Array.from({length:3+Math.floor(Math.random()*5)},()=>Math.floor(Math.random()*9));pos=0;playing=true;info.textContent='İzle...';seq.forEach((v,n)=>setTimeout(()=>{flash(v);if(n===seq.length-1)setTimeout(()=>info.textContent='Sıra sende!',500)},n*550))}function click(i){if(!playing)return;flash(i);if(i!==seq[pos]){playing=false;info.textContent='💥 Yanlış! Tekrar dene.';return}pos++;if(pos===seq.length){playing=false;info.textContent='🎉 Harika hafıza!'}}}</script>
