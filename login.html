<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Giriş Yap | JEUFREX</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f5f7;color:#171717}.container{width:min(440px,calc(100% - 30px));background:#fff;padding:35px;border-radius:24px;box-shadow:0 15px 50px rgba(0,0,0,.08)}.logo{text-align:center;font-size:30px;font-weight:900;letter-spacing:1px;margin-bottom:8px}.subtitle{text-align:center;color:#777;margin-bottom:28px}label{display:block;margin-top:17px;margin-bottom:7px;font-size:14px;font-weight:700}input{width:100%;padding:14px;border:1px solid #d9d9df;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:#111}button{width:100%;margin-top:25px;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#message{display:none;margin-top:18px;padding:13px;border-radius:11px;font-size:14px;line-height:1.4}.register{text-align:center;margin-top:22px;color:#777;font-size:14px}.register a{color:#111;font-weight:700;text-decoration:none}</style>
</head>
<body><div class="container"><div class="logo">JEUFREX</div><div class="subtitle">Hesabına giriş yap.</div><form id="loginForm"><label for="email">E-posta</label><input id="email" type="email" placeholder="ornek@gmail.com" autocomplete="email" required><label for="password">Şifre</label><input id="password" type="password" placeholder="Şifren" autocomplete="current-password" required><button id="loginButton" type="submit">Giriş Yap</button><div id="message"></div></form><div class="register">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://cqxxobmvycesunyxicjj.supabase.co";
const SUPABASE_KEY="sb_publishable_C0BYpv-9sknEu1EXbeKLwQ_lMddpL5V";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),message=document.getElementById("message");
function showMessage(text,success=false){message.style.display="block";message.textContent=text;message.style.background=success?"#e9f8ee":"#fff0f0";message.style.color=success?"#176b35":"#a30000";}
form.addEventListener("submit",async event=>{event.preventDefault();button.disabled=true;button.textContent="Giriş yapılıyor...";try{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error("Oturum oluşturulamadı.");showMessage("🎉 Giriş başarılı!",true);setTimeout(()=>window.location.replace("index.html"),300);}catch(error){console.error(error);showMessage("Giriş başarısız: "+(error.message||"Bilinmeyen hata."));button.disabled=false;button.textContent="Giriş Yap";}});
</script></body></html>
