<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Giriş Yap | JEUFREX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #171717;
    }

    .container {
      width: min(440px, calc(100% - 30px));
      background: white;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9d9df;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 11px;
      font-size: 14px;
      line-height: 1.4;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #777;
      font-size: 14px;
    }

    .register a {
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      JEUFREX
    </div>

    <div class="subtitle">
      Hesabına giriş yap.
    </div>

    <form id="loginForm">

      <label for="email">
        E-posta
      </label>

      <input
        id="email"
        type="email"
        placeholder="ornek@gmail.com"
        autocomplete="email"
        required
      >

      <label for="password">
        Şifre
      </label>

      <input
        id="password"
        type="password"
        placeholder="Şifren"
        autocomplete="current-password"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        Giriş Yap
      </button>

      <div id="message"></div>

    </form>

    <div class="register">
      Hesabın yok mu?
      <a href="register.html">
        Kayıt Ol
      </a>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://cqxxobmvycesunyxicjj.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHhvYm12eWNlc3VueXhpY2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTQ3MzIsImV4cCI6MjEwMzIzMDczMn0.dzHRAvnBUf_sSkOFVrCCmuutG0RVzaxvxTjsEPSw0vk";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTLER
    // ==========================================

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // ==========================================
    // MESAJ
    // ==========================================

    function showMessage(
      text,
      success = false
    ) {

      message.style.display = "block";

      message.textContent = text;

      if (success) {

        message.style.background =
          "#e9f8ee";

        message.style.color =
          "#176b35";

      } else {

        message.style.background =
          "#fff0f0";

        message.style.color =
          "#a30000";

      }

    }


    // ==========================================
    // GİRİŞ
    // ==========================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        button.disabled = true;

        button.textContent =
          "Giriş yapılıyor...";


        try {

          // --------------------------------------
          // SUPABASE AUTH GİRİŞİ
          // --------------------------------------

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          if (error) {
            throw error;
          }


          if (!data.user) {
            throw new Error(
              "Kullanıcı bilgisi alınamadı."
            );
          }


          // --------------------------------------
          // PROFİL / BAN KONTROLÜ
          // --------------------------------------

          const {
            data: profile,
            error: profileError
          } =
            await supabaseClient
              .from("profiles")
              .select(
                "is_banned"
              )
              .eq(
                "id",
                data.user.id
              )
              .maybeSingle();


          if (profileError) {

            console.error(
              profileError
            );

            // Güvenli tarafta kal:
            // Profil kontrolü yapılamıyorsa
            // girişe devam ettirme.

            await supabaseClient.auth.signOut();

            throw new Error(
              "Hesap durumu kontrol edilemedi. Lütfen tekrar deneyin."
            );

          }


          // --------------------------------------
          // BANLI MI?
          // --------------------------------------

          if (
            profile &&
            profile.is_banned === true
          ) {

            await supabaseClient.auth.signOut();

            showMessage(
              "🚫 Bu hesap admin tarafından banlanmış. Giriş yapamazsın."
            );

            button.disabled = false;

            button.textContent =
              "Giriş Yap";

            return;

          }


          // --------------------------------------
          // BAŞARILI
          // --------------------------------------

          showMessage(
            "🎉 Giriş başarılı! JEUFREX açılıyor...",
            true
          );


          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            800
          );


        } catch (error) {

          console.error(error);

          showMessage(
            "Giriş başarısız: " +
            (
              error.message ||
              "Bilinmeyen hata."
            )
          );

          button.disabled = false;

          button.textContent =
            "Giriş Yap";

        }

      }
    );

  </script>

</body>
</html>
```
