</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://cqxxobmvycesunyxicjj.supabase.co";

  // Buraya mevcut çalışan SUPABASE_KEY değerini
  // kendi kodundaki gibi bırak.
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHhvYm12eWNlc3VueXhpY2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTQ3MzIsImV4cCI6MjEwMzIzMDczMn0.dzHRAvnBUf_sSkOFVrCCmuutG0RVzaxvxTjsEPSw0vk";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENTLER
  // ==========================================

  const loading =
    document.getElementById("loading");

  const profileCard =
    document.getElementById("profileCard");

  const displayName =
    document.getElementById("displayName");

  const usernameElement =
    document.getElementById("username");

  const avatar =
    document.getElementById("avatar");

  const bio =
    document.getElementById("bio");

  const followersCount =
    document.getElementById("followersCount");

  const followingCount =
    document.getElementById("followingCount");

  const actions =
    document.getElementById("actions");

  const message =
    document.getElementById("message");


  // ==========================================
  // URL
  // ==========================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const requestedUsername =
    params.get("user");


  // ==========================================
  // MESAJ
  // ==========================================

  function showMessage(
    text,
    success = false
  ) {

    message.style.display = "block";

    message.textContent = text;

    message.style.background =
      success ? "#e9f8ee" : "#fff0f0";

    message.style.color =
      success ? "#176b35" : "#a30000";

  }


  // ==========================================
  // TAKİPÇİ SAYILARI
  // ==========================================

  async function loadStats(userId) {

    const {
      count: followers
    } =
      await supabaseClient
        .from("follows")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq("following_id", userId);


    const {
      count: following
    } =
      await supabaseClient
        .from("follows")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq("follower_id", userId);


    followersCount.textContent =
      followers || 0;

    followingCount.textContent =
      following || 0;

  }


  // ==========================================
  // TAKİP DURUMU
  // ==========================================

  async function checkFollowing(
    currentUserId,
    profileUserId
  ) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("follows")
        .select("*")
        .eq(
          "follower_id",
          currentUserId
        )
        .eq(
          "following_id",
          profileUserId
        )
        .maybeSingle();


    if (error) {

      console.error(error);

      return false;

    }


    return !!data;

  }


  // ==========================================
  // TAKİP ET
  // ==========================================

  async function followUser(
    currentUserId,
    profileUserId,
    button
  ) {

    button.disabled = true;

    button.textContent =
      "İşleniyor...";


    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .insert({

          follower_id:
            currentUserId,

          following_id:
            profileUserId

        });


    if (error) {

      showMessage(
        "Takip işlemi başarısız: " +
        error.message
      );

      button.disabled = false;

      button.textContent =
        "Takip Et";

      return;

    }


    button.disabled = false;

    button.textContent =
      "✓ Takiptesin";

    button.className =
      "secondary";


    button.onclick =
      async function() {

        await unfollowUser(
          currentUserId,
          profileUserId,
          button
        );

      };


    await loadStats(
      profileUserId
    );

  }


  // ==========================================
  // TAKİPTEN ÇIK
  // ==========================================

  async function unfollowUser(
    currentUserId,
    profileUserId,
    button
  ) {

    button.disabled = true;

    button.textContent =
      "İşleniyor...";


    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          currentUserId
        )
        .eq(
          "following_id",
          profileUserId
        );


    if (error) {

      showMessage(
        "Takipten çıkılamadı: " +
        error.message
      );

      button.disabled = false;

      button.textContent =
        "✓ Takiptesin";

      return;

    }


    button.disabled = false;

    button.textContent =
      "Takip Et";

    button.className = "";


    button.onclick =
      async function() {

        await followUser(
          currentUserId,
          profileUserId,
          button
        );

      };


    await loadStats(
      profileUserId
    );

  }


  // ==========================================
  // ANA
  // ==========================================

  async function loadProfile() {

    const {
      data: {
        user: currentUser
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if (!currentUser) {

      window.location.href =
        "login.html";

      return;

    }


    let profileUserId =
      currentUser.id;

    let profile = null;


    // ==========================================
    // BAŞKASININ PROFİLİ
    // ==========================================

    if (requestedUsername) {

      const cleanUsername =
        requestedUsername.startsWith("@")
          ? requestedUsername
          : "@" + requestedUsername;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "username",
            cleanUsername
          )
          .maybeSingle();


      if (error) {

        showMessage(
          "Profil yüklenemedi: " +
          error.message
        );

        loading.style.display =
          "none";

        return;

      }


      if (!data) {

        showMessage(
          "Bu kullanıcı bulunamadı."
        );

        loading.style.display =
          "none";

        return;

      }


      profile = data;

      profileUserId =
        data.id;

    }


    // ==========================================
    // KENDİ PROFİLİ
    // ==========================================

    else {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            currentUser.id
          )
          .maybeSingle();


      if (error) {

        console.error(error);

      }


      profile = data;


      // Profil yoksa oluştur
      if (!profile) {

        const username =
          currentUser
            .user_metadata
            ?.username ||
          "@kullanici" +
          Math.floor(
            Math.random() * 100000
          );


        const name =
          currentUser
            .user_metadata
            ?.display_name ||
          "Kullanıcı";


        const {
          data: newProfile,
          error: createError
        } =
          await supabaseClient
            .from("profiles")
            .insert({

              id:
                currentUser.id,

              username:
                username,

              display_name:
                name

            })
            .select()
            .single();


        if (createError) {

          showMessage(
            "Profil oluşturulamadı: " +
            createError.message
          );

          loading.style.display =
            "none";

          return;

        }


        profile =
          newProfile;

      }

    }


    // ==========================================
    // PROFİL BİLGİLERİ
    // ==========================================

    const name =
      profile.display_name ||
      "Kullanıcı";

    const username =
      profile.username ||
      "@kullanici";


    displayName.textContent =
      name;

    usernameElement.textContent =
      username;

    bio.textContent =
      profile.bio ||
      "Henüz bir biyografi eklenmemiş.";

    avatar.textContent =
      name
        .charAt(0)
        .toUpperCase();


    // ==========================================
    // İSTATİSTİKLER
    // ==========================================

    await loadStats(
      profileUserId
    );


    // ==========================================
    // BUTONLAR
    // ==========================================

    if (
      profileUserId ===
      currentUser.id
    ) {

      const editButton =
        document.createElement(
          "button"
        );

      editButton.textContent =
        "✏️ Profili Düzenle";


      // BURASI DEĞİŞTİ:
      // Profil düzenleme sayfasına gider.

      editButton.onclick =
        function() {

          window.location.href =
            "edit-profile.html";

        };


      actions.appendChild(
        editButton
      );

    }


    // ==========================================
    // BAŞKA KULLANICI
    // ==========================================

    else {

      const followButton =
        document.createElement(
          "button"
        );


      let isFollowing =
        await checkFollowing(
          currentUser.id,
          profileUserId
        );


      if (isFollowing) {

        followButton.textContent =
          "✓ Takiptesin";

        followButton.className =
          "secondary";

      }

      else {

        followButton.textContent =
          "Takip Et";

      }


      followButton.onclick =
        async function() {

          if (isFollowing) {

            await unfollowUser(
              currentUser.id,
              profileUserId,
              followButton
            );

            isFollowing = false;

          }

          else {

            await followUser(
              currentUser.id,
              profileUserId,
              followButton
            );

            isFollowing = true;

          }

        };


      actions.appendChild(
        followButton
      );

    }


    // ==========================================
    // GÖSTER
    // ==========================================

    loading.style.display =
      "none";

    profileCard.style.display =
      "block";

  }


  // ==========================================
  // BAŞLAT
  // ==========================================

  loadProfile();

</script>

</body>
</html>
