<body>

<header>

  <nav>

  </nav>
</header>

<main>

  <div id="loading" class="loading">
    Profil yükleniyor...
  </div>

  <section
    id="profileCard"
    class="profile-card"
    style="display:none;"
  >

    <div class="top">

      <div id="avatar" class="avatar">?</div>

      <div>
        <h1 id="displayName" class="name">
          Kullanıcı
        </h1>

        <div id="username" class="username">
          @kullanici
        </div>
      </div>

    </div>

    <div id="bio" class="bio"></div>

    <div class="stats">

      <div class="stat">
        <strong id="followersCount">0</strong>
        <span>Takipçi</span>
      </div>

      <div class="stat">
        <strong id="followingCount">0</strong>
        <span>Takip</span>
      </div>

    </div>

    <div id="actions" class="actions"></div>

    <div id="message"></div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://cqxxobmvycesunyxicjj.supabase.co";

  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHhvYm12eWNlc3VueXhpY2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTQ3MzIsImV4cCI6MjEwMzIzMDczMn0.dzHRAvnBUf_sSkOFVrCCmuutG0RVzaxvxTjsEPSw0vk";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loading =
    document.getElementById("loading");

  const profileCard =
    document.getElementById("profileCard");

  const displayName =
    document.getElementById("displayName");

  const usernameElement =
    document.getElementById("username");

  const avatar =
    document.getElementById("avatar");

  const bio =
    document.getElementById("bio");

  const followersCount =
    document.getElementById("followersCount");

  const followingCount =
    document.getElementById("followingCount");

  const actions =
    document.getElementById("actions");

  const message =
    document.getElementById("message");


  /*
   * URL:
   *
   * profile.html
   * -> kendi profilin
   *
   * profile.html?user=admin
   * -> @admin profili
   *
   * profile.html?user=@admin
   * -> @admin profili
   */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const requestedUsername =
    params.get("user");


  function showMessage(
    text,
    success = false
  ) {
    message.style.display = "block";
    message.textContent = text;

    message.style.background =
      success ? "#e9f8ee" : "#fff0f0";

    message.style.color =
      success ? "#176b35" : "#a30000";
  }


  /*
   * Kullanıcı adını düzgün hale getirir.
   *
   * admin
   * @admin
   *
   * ikisi de @admin olur.
   */

  function normalizeUsername(value) {
    if (!value) return null;

    value = value.trim();

    if (!value.startsWith("@")) {
      value = "@" + value;
    }

    return value;
  }


  /*
   * İSTATİSTİKLER
   */

  async function loadStats(userId) {

    const followersResult =
      await supabaseClient
        .from("follows")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "following_id",
          userId
        );

    const followingResult =
      await supabaseClient
        .from("follows")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "follower_id",
          userId
        );

    followersCount.textContent =
      followersResult.count || 0;

    followingCount.textContent =
      followingResult.count || 0;
  }


  /*
   * TAKİP DURUMU
   */

  async function checkFollowing(
    currentUserId,
    profileUserId
  ) {

    const { data, error } =
      await supabaseClient
        .from("follows")
        .select("id")
        .eq(
          "follower_id",
          currentUserId
        )
        .eq(
          "following_id",
          profileUserId
        )
        .maybeSingle();

    if (error) {
      console.error(error);
      return false;
    }

    return !!data;
  }


  /*
   * TAKİP ET
   */

  async function followUser(
    currentUserId,
    profileUserId,
    button
  ) {

    button.disabled = true;
    button.textContent = "İşleniyor...";

    const { error } =
      await supabaseClient
        .from("follows")
        .insert({
          follower_id: currentUserId,
          following_id: profileUserId
        });

    if (error) {

      showMessage(
        "Takip işlemi başarısız: " +
        error.message
      );

      button.disabled = false;
      button.textContent = "Takip Et";

      return;
    }

    button.disabled = false;
    button.textContent = "✓ Takiptesin";
    button.className = "secondary";

    button.onclick = function() {
      unfollowUser(
        currentUserId,
        profileUserId,
        button
      );
    };

    await loadStats(profileUserId);
  }


  /*
   * TAKİPTEN ÇIK
   */

  async function unfollowUser(
    currentUserId,
    profileUserId,
    button
  ) {

    button.disabled = true;
    button.textContent = "İşleniyor...";

    const { error } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          currentUserId
        )
        .eq(
          "following_id",
          profileUserId
        );

    if (error) {

      showMessage(
        "Takipten çıkılamadı: " +
        error.message
      );

      button.disabled = false;
      button.textContent = "✓ Takiptesin";

      return;
    }

    button.disabled = false;
    button.textContent = "Takip Et";
    button.className = "";

    button.onclick = function() {
      followUser(
        currentUserId,
        profileUserId,
        button
      );
    };

    await loadStats(profileUserId);
  }


  /*
   * KENDİ PROFİLİNİ GETİR
   */

  async function getOwnProfile(currentUser) {

    let { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();

    if (error) {
      throw new Error(
        "Profil alınamadı: " +
        error.message
      );
    }

    /*
     * Profil yoksa oluşturmaya çalış.
     */

    if (!data) {

      const meta =
        currentUser.user_metadata || {};

      let newUsername =
        meta.username || null;

      if (newUsername) {
        newUsername =
          normalizeUsername(newUsername);
      }

      if (!newUsername) {
        newUsername =
          "@kullanici" +
          Math.floor(
            Math.random() * 900000 + 100000
          );
      }

      const newName =
        meta.display_name ||
        currentUser.email?.split("@")[0] ||
        "Kullanıcı";

      const result =
        await supabaseClient
          .from("profiles")
          .insert({
            id: currentUser.id,
            username: newUsername,
            display_name: newName,
            bio: ""
          })
          .select("*")
          .single();

      if (result.error) {
        throw new Error(
          "Profil oluşturulamadı: " +
          result.error.message
        );
      }

      data = result.data;
    }

    return data;
  }


  /*
   * BAŞKASININ PROFİLİNİ GETİR
   */

  async function getProfileByUsername(
    username
  ) {

    const cleanUsername =
      normalizeUsername(username);

    if (!cleanUsername) {
      return null;
    }

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "username",
          cleanUsername
        )
        .maybeSingle();

    if (error) {
      throw new Error(
        "Profil alınamadı: " +
        error.message
      );
    }

    return data;
  }


  /*
   * ANA FONKSİYON
   */

  async function loadProfile() {

    loading.style.display = "block";
    profileCard.style.display = "none";
    actions.innerHTML = "";
    message.style.display = "none";

    /*
     * ÖNCE OTURUMU KONTROL ET.
     */

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();

    if (
      sessionError ||
      !sessionData.session
    ) {

      window.location.replace(
        "login.html"
      );

      return;
    }

    const currentUser =
      sessionData.session.user;

    let profile;
    let profileUserId;

    try {

      /*
       * URL'de user varsa başkasının profili.
       */

      if (requestedUsername) {

        profile =
          await getProfileByUsername(
            requestedUsername
          );

        if (!profile) {

          loading.innerHTML = `
            <div class="error">
              <h2>😕 Kullanıcı bulunamadı</h2>
              <p>
                Bu kullanıcı adıyla kayıtlı bir profil yok.
              </p>
              <br>
              <button onclick="window.location.href='index.html'">
                Ana Sayfaya Dön
              </button>
            </div>
          `;

          return;
        }

        profileUserId =
          profile.id;

      }

      /*
       * URL'de user yoksa kendi profilin.
       */

      else {

        profile =
          await getOwnProfile(
            currentUser
          );

        profileUserId =
          currentUser.id;
      }

    } catch (error) {

      console.error(error);

      loading.innerHTML = `
        <div class="error">
          <h2>❌ Profil yüklenemedi</h2>
          <p>${escapeHtml(error.message)}</p>
          <br>
          <button onclick="location.reload()">
            Tekrar Dene
          </button>
        </div>
      `;

      return;
    }


    /*
     * PROFİL BİLGİLERİNİ GÖSTER
     */

    const name =
      profile.display_name ||
      "Kullanıcı";

    const username =
      normalizeUsername(
        profile.username
      ) ||
      "@kullanici";

    displayName.textContent =
      name;

    usernameElement.textContent =
      username;

    bio.textContent =
      profile.bio ||
      "Henüz bir biyografi eklenmemiş.";

    avatar.textContent =
      name
        .trim()
        .charAt(0)
        .toUpperCase() ||
      "?";


    /*
     * TAKİPÇİ SAYILARI
     */

    await loadStats(
      profileUserId
    );


    /*
     * KENDİ PROFİLİMİZ
     */

    if (
      profileUserId ===
      currentUser.id
    ) {

      /*
       * Profil düzenle
       */

      const editButton =
        document.createElement("button");

      editButton.textContent =
        "✏️ Profili Düzenle";

      editButton.onclick =
        function() {

          alert(
            "Profil düzenleme bölümünü bir sonraki aşamada ekleyeceğiz."
          );

        };

      actions.appendChild(
        editButton
      );


      /*
       * ADMIN KONTROLÜ
       */

      const {
        data: adminProfile
      } =
        await supabaseClient
          .from("profiles")
          .select("is_admin")
          .eq(
            "id",
            currentUser.id
          )
          .maybeSingle();


      if (
        adminProfile &&
        adminProfile.is_admin === true
      ) {

        const adminButton =
          document.createElement("button");

        adminButton.textContent =
          "👑 Admin Paneli";

        adminButton.className =
          "admin";

        adminButton.onclick =
          function() {

            /*
             * SADECE admin.html'ye git.
             * index.html'ye veya login.html'ye
             * yönlendirme YOK.
             */

            window.location.href =
              "admin.html";
          };

        actions.appendChild(
          adminButton
        );
      }

    }


    /*
     * BAŞKA KULLANICI
     */

    else {

      const followButton =
        document.createElement("button");

      const isFollowing =
        await checkFollowing(
          currentUser.id,
          profileUserId
        );

      if (isFollowing) {

        followButton.textContent =
          "✓ Takiptesin";

        followButton.className =
          "secondary";

        followButton.onclick =
          function() {

            unfollowUser(
              currentUser.id,
              profileUserId,
              followButton
            );

          };

      } else {

        followButton.textContent =
          "Takip Et";

        followButton.onclick =
          function() {

            followUser(
              currentUser.id,
              profileUserId,
              followButton
            );

          };
      }

      actions.appendChild(
        followButton
      );
    }


    /*
     * PROFİLİ GÖSTER
     */

    loading.style.display =
      "none";

    profileCard.style.display =
      "block";
  }


  /*
   * HTML GÜVENLİĞİ
   */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /*
   * BAŞLAT
   */

  loadProfile();

</script>

</body>
</html>
