<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil | JEUFREX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}header{min-height:70px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;padding:12px 35px;gap:20px}.logo{font-size:25px;font-weight:900;text-decoration:none;color:#111}nav{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}nav a{text-decoration:none;color:#555;font-weight:700;font-size:14px}nav a:hover{color:#000}main{width:min(800px,calc(100% - 30px));margin:40px auto}.profile-card{background:#fff;border-radius:25px;padding:35px;box-shadow:0 8px 30px #0000000d}.top{display:flex;align-items:center;gap:25px}.avatar-wrap{position:relative;width:105px;height:105px;flex-shrink:0}.avatar{width:105px;height:105px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.photo-button{position:absolute;right:-3px;bottom:-3px;width:36px;height:36px;padding:0;border:3px solid #fff;border-radius:50%;background:#111;color:#fff;font-size:16px;cursor:pointer}.photo-button:hover{opacity:.9}.name{font-size:28px;font-weight:900;margin:0 0 6px}.username{color:#777;font-size:15px}.bio{margin-top:25px;color:#555;line-height:1.5;white-space:pre-wrap}.stats{display:flex;gap:35px;margin-top:28px;border-top:1px solid #eee;padding-top:25px}.stat{text-align:center}.stat strong{display:block;font-size:22px}.stat span{color:#777;font-size:13px}.actions{margin-top:25px;display:flex;flex-wrap:wrap;gap:10px}button{border:0;border-radius:12px;padding:13px 24px;background:#111;color:#fff;font-weight:800;cursor:pointer}button:hover{opacity:.9}button.secondary{background:#eee;color:#111}button.admin{background:#6d28d9}button:disabled{opacity:.6;cursor:wait}#message{display:none;margin-top:20px;padding:13px;border-radius:12px;font-size:14px}.loading{text-align:center;padding:50px;color:#777}.error{background:#fff;border-radius:20px;padding:30px;text-align:center;color:#a00000}.photo-help{margin-top:9px;color:#888;font-size:11px}.photo-input{display:none}@media(max-width:700px){header{padding:12px 15px;align-items:flex-start}nav{gap:10px}nav a{font-size:12px}.top{align-items:flex-start}.avatar-wrap,.avatar{width:80px;height:80px}.avatar{font-size:30px}.name{font-size:22px}.stats{gap:20px}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">JEUFREX</a><nav><a href="index.html">Ana Sayfa</a><a href="games.html">🎮 Oyunlar</a><a href="music.html">🎵 Müzik</a><a href="videos.html">🎬 Videolar</a><a href="community.html">👥 Topluluk</a><a href="explore.html">✨ Keşfet</a></nav></header>
<main>
<div id="loading" class="loading">Profil yükleniyor...</div>
<section id="profileCard" class="profile-card" style="display:none">
<div class="top"><div class="avatar-wrap"><div id="avatar" class="avatar">?</div><input id="photoInput" class="photo-input" type="file" accept="image/png,image/jpeg,image/webp"><button id="photoButton" class="photo-button" title="Profil fotoğrafını değiştir">📷</button></div><div><h1 id="displayName" class="name">Kullanıcı</h1><div id="username" class="username">@kullanici</div><div id="photoHelp" class="photo-help"></div></div></div>
<div id="bio" class="bio"></div><div class="stats"><div class="stat"><strong id="followersCount">0</strong><span>Takipçi</span></div><div class="stat"><strong id="followingCount">0</strong><span>Takip</span></div></div><div id="actions" class="actions"></div><div id="message"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://cqxxobmvycesunyxicjj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHhvYm12eWNlc3VueXhpY2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTQ3MzIsImV4cCI6MjEwMzIzMDczMn0.dzHRAvnBUf_sSkOFVrCCmuutG0RVzaxvxTjsEPSw0vk";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),loading=$("loading"),profileCard=$("profileCard"),displayName=$("displayName"),usernameElement=$("username"),avatar=$("avatar"),bio=$("bio"),followersCount=$("followersCount"),followingCount=$("followingCount"),actions=$("actions"),message=$("message"),photoInput=$("photoInput"),photoButton=$("photoButton"),photoHelp=$("photoHelp");
const requestedUsername=new URLSearchParams(location.search).get("user");
function normalizeUsername(v){if(!v)return null;v=v.trim();return v.startsWith("@")?v:"@"+v}
function showMessage(text,success=false){message.style.display="block";message.textContent=text;message.style.background=success?"#e9f8ee":"#fff0f0";message.style.color=success?"#176b35":"#a30000"}
function setAvatar(url,name){avatar.innerHTML="";if(url){const img=document.createElement("img");img.src=url;img.alt="Profil fotoğrafı";img.onerror=()=>setAvatar(null,name);avatar.appendChild(img)}else avatar.textContent=name?.trim().charAt(0).toUpperCase()||"?"}
async function loadStats(id){const a=await supabaseClient.from("follows").select("*",{count:"exact",head:true}).eq("following_id",id);const b=await supabaseClient.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",id);followersCount.textContent=a.count||0;followingCount.textContent=b.count||0}
async function checkFollowing(a,b){const {data,error}=await supabaseClient.from("follows").select("id").eq("follower_id",a).eq("following_id",b).maybeSingle();if(error)console.error(error);return !!data}
async function followUser(a,b,button){button.disabled=true;button.textContent="İşleniyor...";const {error}=await supabaseClient.from("follows").insert({follower_id:a,following_id:b});if(error){showMessage("Takip işlemi başarısız: "+error.message);button.disabled=false;button.textContent="Takip Et";return}button.disabled=false;button.textContent="✓ Takiptesin";button.className="secondary";button.onclick=()=>unfollowUser(a,b,button);await loadStats(b)}
async function unfollowUser(a,b,button){button.disabled=true;button.textContent="İşleniyor...";const {error}=await supabaseClient.from("follows").delete().eq("follower_id",a).eq("following_id",b);if(error){showMessage("Takipten çıkılamadı: "+error.message);button.disabled=false;button.textContent="✓ Takiptesin";return}button.disabled=false;button.textContent="Takip Et";button.className="";button.onclick=()=>followUser(a,b,button);await loadStats(b)}
async function getOwnProfile(u){let {data,error}=await supabaseClient.from("profiles").select("*").eq("id",u.id).maybeSingle();if(error)throw Error("Profil alınamadı: "+error.message);if(!data){const m=u.user_metadata||{};const un=normalizeUsername(m.username)||"@kullanici"+Math.floor(Math.random()*900000+100000);const result=await supabaseClient.from("profiles").insert({id:u.id,username:un,display_name:m.display_name||u.email?.split("@")[0]||"Kullanıcı",bio:""}).select("*").single();if(result.error)throw Error("Profil oluşturulamadı: "+result.error.message);data=result.data}return data}
async function getProfileByUsername(un){const clean=normalizeUsername(un);if(!clean)return null;const {data,error}=await supabaseClient.from("profiles").select("*").eq("username",clean).maybeSingle();if(error)throw Error("Profil alınamadı: "+error.message);return data}
async function uploadProfilePhoto(user){const file=photoInput.files[0];if(!file)return;if(!["image/jpeg","image/png","image/webp"].includes(file.type))return showMessage("❌ Sadece JPG, PNG veya WebP yükleyebilirsin.");if(file.size>5*1024*1024)return showMessage("❌ Fotoğraf en fazla 5 MB olabilir.");photoButton.disabled=true;photoHelp.textContent="Fotoğraf yükleniyor...";try{const ext=file.type.split("/")[1].replace("jpeg","jpg");const path=user.id+"/avatar."+ext;const {error:uploadError}=await supabaseClient.storage.from("avatars").upload(path,file,{upsert:true,contentType:file.type,cacheControl:"3600"});if(uploadError)throw uploadError;const {data:urlData}=supabaseClient.storage.from("avatars").getPublicUrl(path);const url=urlData.publicUrl+"?v="+Date.now();const {error:updateError}=await supabaseClient.from("profiles").update({avatar_url:url}).eq("id",user.id);if(updateError)throw updateError;setAvatar(url,displayName.textContent);photoHelp.textContent="Profil fotoğrafın güncellendi ✓";showMessage("📷 Profil fotoğrafı başarıyla güncellendi.",true)}catch(e){console.error(e);showMessage("❌ Fotoğraf yüklenemedi: "+e.message+" — Supabase Storage'da 'avatars' adlı public bucket ve yükleme politikası gerekli.");photoHelp.textContent="Yükleme başarısız."}finally{photoButton.disabled=false;photoInput.value=""}}
async function loadProfile(){loading.style.display="block";profileCard.style.display="none";actions.innerHTML="";message.style.display="none";const {data:sd,error:se}=await supabaseClient.auth.getSession();if(se||!sd.session){location.replace("login.html");return}const currentUser=sd.session.user;let profile,profileUserId,isOwn=false;try{if(requestedUsername){profile=await getProfileByUsername(requestedUsername);if(!profile){loading.innerHTML='<div class="error"><h2>😕 Kullanıcı bulunamadı</h2><p>Bu kullanıcı adıyla kayıtlı bir profil yok.</p><br><button onclick="location.href=\'index.html\'">Ana Sayfaya Dön</button></div>';return}profileUserId=profile.id}else{profile=await getOwnProfile(currentUser);profileUserId=currentUser.id;isOwn=true}}catch(e){console.error(e);loading.innerHTML='<div class="error"><h2>❌ Profil yüklenemedi</h2><p>'+escapeHtml(e.message)+'</p><br><button onclick="location.reload()">Tekrar Dene</button></div>';return}
const name=profile.display_name||"Kullanıcı",un=normalizeUsername(profile.username)||"@kullanici";displayName.textContent=name;usernameElement.textContent=un;bio.textContent=profile.bio||"Henüz bir biyografi eklenmemiş.";const ownAvatar=currentUser.user_metadata?.avatar_url;setAvatar(profile.avatar_url||((isOwn)?ownAvatar:null),name);await loadStats(profileUserId);
if(isOwn){photoButton.style.display="block";photoHelp.textContent="📷 Kameraya tıklayarak profil fotoğrafı seç";photoButton.onclick=()=>photoInput.click();photoInput.onchange=()=>uploadProfilePhoto(currentUser);const edit=document.createElement("button");edit.textContent="✏️ Profili Düzenle";edit.onclick=()=>alert("Profil düzenleme bölümü yakında.");actions.appendChild(edit);const {data:admin}=await supabaseClient.from("profiles").select("is_admin").eq("id",currentUser.id).maybeSingle();if(admin?.is_admin===true){const ab=document.createElement("button");ab.textContent="👑 Admin Paneli";ab.className="admin";ab.onclick=()=>location.href="admin.html";actions.appendChild(ab)}}else{photoButton.style.display="none";photoHelp.textContent="";const fb=document.createElement("button");const following=await checkFollowing(currentUser.id,profileUserId);fb.textContent=following?"✓ Takiptesin":"Takip Et";if(following){fb.className="secondary";fb.onclick=()=>unfollowUser(currentUser.id,profileUserId,fb)}else fb.onclick=()=>followUser(currentUser.id,profileUserId,fb);actions.appendChild(fb)}loading.style.display="none";profileCard.style.display="block"}
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
loadProfile();
</script>
</body>
</html>
