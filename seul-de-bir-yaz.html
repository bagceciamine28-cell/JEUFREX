const pages = [
`Seul sabahı\n\nSeo-jin, okulun kapısından içeri girdiğinde yaz tatilinin gerçekten bittiğini ilk kez o anda hissetti. Omzundaki çanta ağır değildi; ağır olan, yeni bir dönemin nereye gideceğini bilmemesiydi. Koridorda öğrenciler birbirlerine yaz boyunca yaşadıklarını anlatıyor, pencerelerden içeri yumuşak bir ağustos ışığı süzülüyordu. Tam sınıfa girecekken ilan panosundaki küçük bir afiş dikkatini çekti: Medya Kulübü yeni üyeler arıyordu. Seo-jin afişi koparmadı. Sadece telefonuyla fotoğrafını çekti. Henüz bilmiyordu ama o küçük fotoğraf, hayatının en uzun yazının ilk satırı olacaktı.`,
`Yeni sıra\n\nMin-ho sınıfa son anda yetişti. Öğretmen yoklama alırken sessizce arka sıraya geçti ve Seo-jin'in masasındaki kulüp afişini fark etti. “Sen de mi düşünüyorsun?” diye fısıldadı. Seo-jin omuz silkti. “Belki.” Min-ho gülümsedi. “Belki, evet demenin en gizemli hâli.” Teneffüste ikisi birlikte kulüp odasına gittiler. Oda beklediklerinden küçüktü: iki kamera, eski bir tripod, üç mikrofon ve duvarda geçen yıllardan kalma fotoğraflar vardı. Kulüp başkanı Yuna onları içeri alıp tek bir soru sordu: “Bir hikâyeyi çekmek isteseydiniz, neyi anlatırdınız?”`,
`İlk fikir\n\nSeo-jin hemen cevap vermedi. Okulda herkesin bildiği şeyleri çekmenin kolay olduğunu düşündü. Min-ho ise pencereden dışarı baktı. “Kimsenin fark etmediği şeyleri,” dedi. Yuna başını salladı. “Güzel. O zaman bu yılın ilk projesi belli.” Öğrenciler şaşkınlıkla birbirlerine baktılar. Projenin konusu okulun görünmeyen hikâyeleriydi. Seo-jin görevi ciddiye aldı. Koridorlarda dolaşacak, öğretmenlerin ve öğrencilerin küçük alışkanlıklarını gözlemleyeceklerdi. İlk çekimde kamerayı Seo-jin taşıyacaktı. Min-ho ise ses kaydından sorumluydu. İkisi ekip arkadaşı olmuştu bile.`,
`Yağmurdan önce\n\nÖğleden sonra hava birden kapandı. Yuna çekim listesini kontrol ederken Min-ho okulun çatısından gelen garip bir müzik sesi duydu. “Bunu kaydetmeliyiz,” dedi. Seo-jin kamerayı açtı. Merdivenleri çıktıklarında ses kesildi. Çatıda kimse yoktu. Yalnızca eski bir radyo duruyordu. Radyonun yanında küçük bir kaset vardı. Üzerinde tarih yazıyordu: 17 Ağustos. Yuna kaseti eline aldı. “Bu yıl değil,” dedi. “Beş yıl önce.” O anda ilk kez projenin basit bir okul videosundan daha fazlasına dönüşebileceğini hissettiler.`,
`Eski kaset\n\nKaseti kulüp odasındaki eski oynatıcıya taktılar. Cızırtının ardından genç bir öğrencinin sesi duyuldu. Ses, okulun eski medya kulübünden bir anı kaydıydı. Öğrenci okulda kimsenin fark etmediği yerleri anlattı ve kaydın sonunda “Bazen bir yerin sırrı, onu arayan kişiye değil, dinleyen kişiye açılır,” dedi. Kayıt bittiğinde odada sessizlik oldu. Seo-jin ekrana baktı. “Bunu videoya koyabilir miyiz?” Yuna kararsız kaldı. Min-ho ise kasetin arkasındaki küçük etiketi gösterdi. Orada bir oda numarası vardı: 204.`,
`204 numarası\n\nOkulun ikinci katında 204 numaralı oda yıllardır kullanılmıyordu. Kapısında eski bir kilit vardı. Yuna öğretmenden izin istedi. Kapı açıldığında içeride sıralar, kutular ve tozlu bir piyano buldular. Piyanonun üzerinde aynı tarih yazıyordu. Seo-jin kamerayı kaldırdı. Min-ho kutulardan birini açtı ve eski öğrenci fotoğrafları buldu. Fotoğrafların arkasında kısa notlar vardı. Birinde “Yaz bitmeden önce sahne ışıklarını geri getir” yazıyordu. Bu cümle kimsenin anlamadığı bir mesaj gibiydi.`,
`Sahne\n\nYuna okulun eski tiyatro salonundan bahsetti. Salon yıllardır kullanılmıyordu çünkü sahne ışıklarının bir kısmı bozulmuştu. Ekip oraya indi. Perdeler kapalıydı. Seo-jin perdeyi araladığında ışıkların bazıları hâlâ çalışıyordu. Min-ho şaşkınlıkla tavana baktı. Bir projektör yalnızca tek bir sandalyeyi aydınlatıyordu. Sandalyenin üzerinde küçük bir defter vardı. Defterin ilk sayfasında eski medya kulübünün üyeleri yazılıydı. Son sayfada ise yalnızca şu cümle vardı: “Hikâyeyi tamamlayacak kişi henüz gelmedi.”`,
`Defter\n\nSeo-jin defteri dikkatle inceledi. Son sayfada tarih yoktu. Yuna sayfaları çevirdikçe isimler ve küçük anılar ortaya çıktı. Bazı öğrenciler mezun olmuş, bazıları şehir değiştirmişti. Min-ho defterin arasından düşen bir fotoğrafı yakaladı. Fotoğrafta dört kişi vardı. Üçünün isimleri yazılıydı; dördüncü kişinin yüzü ise kalemle kapatılmıştı. Seo-jin fotoğrafı çevirdi. Arkasında “Dördüncü kişi kendi hikâyesini anlatmadan fotoğraf tamamlanmaz” yazıyordu.`,
`Yuna'nın kararı\n\nYuna defteri kulüp dolabına koymak istedi. Seo-jin buna karşı çıktı. “Bunu bulduysak hikâyenin parçası yapmalıyız.” Yuna bir süre düşündü. Sonunda kabul etti ama bir şart koydu: kimsenin özel hayatını araştırmayacaklardı. Amaç gizem yaratmak değil, geçmişte kalan hikâyeleri anlamaktı. Min-ho gülümsedi. “O zaman yarın arşive gidiyoruz.” Seo-jin başını salladı. O gece eve dönerken ilk kez okulun sıradan görünmediğini fark etti.`,
`Arşiv odası\n\nErtesi gün arşiv odasının kapısı açıldığında eski gazeteler ve okul yıllıkları karşılarına çıktı. Min-ho yıllıkları sıraya dizdi. Seo-jin medya kulübünün eski üyelerini aradı. Beş yıl önce kulübün başkanının Dae-hyun adında bir öğrenci olduğunu öğrendiler. Dae-hyun'un mezuniyetinden sonra kulüp bir süre kapanmıştı. Fotoğraftaki üç kişinin isimleri bulundu. Dördüncü kişi hakkında ise hiçbir kayıt yoktu. Yuna bunun bir tesadüf olabileceğini söyledi. Tam o sırada Min-ho bir kutunun altından başka bir kaset çıkardı.`,
`İkinci kayıt\n\nKasette bu kez Dae-hyun'un sesi vardı. “Eğer bunu dinliyorsanız, muhtemelen kulüp yeniden canlanmıştır,” diyordu. “Bir gün bu okulda birileri bizim yarım bıraktığımız işi tamamlayacak.” Kayıtta projenin neden yarım kaldığı anlatılmıyordu. Sadece tiyatro salonundaki sahne ışıklarının tekrar yakılmasından bahsediliyordu. Dae-hyun son cümlesinde, “Işık yandığında geçmişi değil, geleceği göreceksiniz,” dedi. Kayıt sona erdi. Seo-jin derin bir nefes aldı. Artık bunun tesadüf olmadığına inanıyordu.`,
`Min-ho'nun şüphesi\n\nMin-ho, eski kayıtların fazla düzenli olmasından şüphelendi. Birileri kasetleri yıllar boyunca saklamış ve doğru kişilerin bulmasını beklemiş olabilirdi. Yuna bu düşünceyi fazla romantik buldu. Seo-jin ise iki tarafı da dinledi. Sonunda karar verdiler: geçmişi çözmeye çalışmak yerine, kendi projelerini hazırlayacaklardı. Belki cevaplar zaten videonun içinde ortaya çıkacaktı. O gün okulun bahçesinde ilk röportajlarını yaptılar. Her öğrenciye aynı soruyu sordular: “Okulda kimsenin fark etmediği güzel bir şey nedir?” Cevaplar beklenmedik derecede samimiydi.`,
`Küçük hikâyeler\n\nBir öğrenci sabahları boş sınıflardaki güneş ışığını sevdiğini söyledi. Bir başkası kantindeki görevlinin herkese isimleriyle seslenmesini anlattı. Bir öğretmen, okulun yağmurdan sonra değişen kokusunu sevdiğini söyledi. Seo-jin kamerayı kapattığında gülümsedi. Min-ho, “Sanırım Dae-hyun'un anlatmak istediği buydu,” dedi. Büyük sırlar yerine küçük hikâyeler. Ancak tam çıkacakları sırada kamera ekranında kırmızı bir ışık yanıp söndü. Kayda alınmamış bir ses dosyası oluşmuştu. Dosyanın adı yalnızca “204” idi.`,
`Ses dosyası\n\nDosyayı açtıklarında birkaç saniyelik koridor sesi duyuldu. Sonra bir kapı gıcırtısı ve piyano tuşu geldi. Kayıt bitti. Yuna bunun kameranın otomatik kaydı olabileceğini söyledi. Min-ho kulüp odasına dönüp sesi bilgisayarda temizledi. Arka planda belli belirsiz bir melodi vardı. Melodi, tiyatro salonundaki eski piyanoda çalınan parçaya benziyordu. Seo-jin notaları yazmaya çalıştı. Parçanın sonunda üç nota tekrar ediyordu. Yuna bunların okulun kuruluş tarihine denk geldiğini fark etti.`,
`Üç nota\n\nÜç nota, eski okul armasının altında yazan üç kelimeyle eşleşiyordu: “Düşün, Üret, Paylaş.” Ekip gülmeye başladı. Belki bütün gizem, yıllar önce kulüp öğrencilerinin okul sloganını kendi yöntemleriyle anlatmasından ibaretti. Yine de tiyatro salonuna tekrar gitmeye karar verdiler. Bu kez projektörün altındaki sandalyede yeni bir şey vardı: küçük bir anahtar. Anahtarın üzerinde 17 yazıyordu. Min-ho anahtarı çevirdi. Salonun yan duvarındaki küçük dolap açıldı. İçinden dört adet boş fotoğraf çerçevesi çıktı.`,
`Dört çerçeve\n\nDört çerçevenin her birinin arkasında farklı bir kelime vardı: Cesaret, Merak, Dostluk ve Başlangıç. Seo-jin kelimeleri yan yana koydu. “Belki dördüncü kişi tek bir insan değil,” dedi. “Belki eksik olan şey, bu dört özelliği taşıyan yeni ekip.” Yuna şaşkınlıkla baktı. Min-ho ise gülümsedi. Dae-hyun'un kaydındaki cümleyi hatırladılar. Hikâyeyi tamamlayacak kişi henüz gelmemişti. Belki de hikâyeyi tamamlayacak kişiler şimdi karşısındaydı.`,
`Yeni karar\n\nEkip projenin adını belirledi: “Görünmeyen Yaz.” Amaç eski gizemi çözmek değil, okulun küçük hikâyelerini bir araya getirmekti. Her biri farklı bir görev üstlendi. Seo-jin yönetmenliği, Min-ho sesi, Yuna röportajları aldı. Dördüncü görev ise boş bırakıldı. Bir gün koridorda Dae-hyun'un fotoğrafındaki üç öğrenciden biriyle karşılaştılar. Mezun olmuştu ama okulda öğretmen yardımcısı olarak bulunuyordu. Adı Mira'ydı. Dördüncü kişi hakkında bir şey biliyordu.`,
`Mira'nın anlattığı\n\nMira, beş yıl önceki projeyi anlattı. Dördüncü kişi gerçekten vardı ama kamerayı kullanmak istemediği için fotoğrafı kapatılmıştı. Projenin amacı onu gizlemek değildi. Arkadaşları onun özel hayatına saygı duymak istemişti. “O kişi bize bir şey öğretti,” dedi Mira. “Herkesin hikâyesi paylaşılmak zorunda değildir.” Seo-jin bunu duyunca rahatladı. Demek ki gizemin cevabı bir kişinin kimliğini bulmak değildi. Asıl mesaj, sınırları korumaktı.`,
`Kamera karşısında\n\nMira, yeni ekibin projesine kısa bir röportaj verdi. Kameraya bakıp okulda geçirdiği yıllardan bahsetti. Sonra Seo-jin'e dönerek, “Sizin hikâyeniz nasıl?” diye sordu. Seo-jin bir an durdu. “Daha yeni başlıyor,” dedi. Min-ho gülerek kameranın arkasından başını salladı. Yuna çekimi bitirdi. O gün ilk bölümün ana görüntüleri tamamlandı. Geriye yalnızca kapanış sahnesi kalmıştı. Bu sahnenin tiyatro salonunda çekilmesine karar verdiler.`,
`Sahneye dönüş\n\nTiyatro salonu akşamüstü sessizdi. Güneş perdelerin arasından süzülüyor, toz zerreleri ışıkta parlıyordu. Seo-jin kamerayı kurdu. Min-ho ses kontrolü yaptı. Yuna projektörleri açtı. Bu kez yalnızca bir sandalye değil, bütün sahne aydınlandı. Dört arkadaş sahnenin ortasına geçti. Kamera kayda girdi. Seo-jin ilk cümlesini söyledi: “Bir okulun hikâyesi sadece derslerden oluşmaz.” Ardından herkes kendi küçük hikâyesini anlattı.`,
`Kayıt\n\nMin-ho, kulüp odasında buldukları kasetlerden bahsetmedi. Bunun yerine seslerin, insanların ve anıların nasıl birbirine bağlandığını anlattı. Yuna, bir röportajın beklenmedik şekilde bir öğrencinin kendini daha iyi hissetmesini sağladığını söyledi. Seo-jin ise kameranın arkasında durmanın ona insanları dinlemeyi öğrettiğini anlattı. Çekim bittiğinde kimse hemen konuşmadı. Sessizlik garip değildi. Sanki yıllar önce yarım kalan bir cümle tamamlanmıştı.`,
`Montaj gecesi\n\nÜçü gece geç saatlere kadar montaj yaptı. Görüntüler arasında okul bahçesi, yağmur, boş sınıflar, tiyatro sahnesi ve öğrencilerin gülüşleri vardı. Sonuna eski kasetten birkaç saniyelik ses eklediler. Ancak Dae-hyun'un sözlerini olduğu gibi kullanmadılar. Onun yerine ekrana tek bir cümle yazdılar: “Hikâyeler bize ait olabilir; ama onları nasıl paylaşacağımız bizim seçimimizdir.” Yuna videoyu izlediğinde gözleri doldu. “Bu, beklediğimden daha iyi.”`,
`İlk gösterim\n\nVideo okulun küçük konferans salonunda gösterilecekti. Öğrenciler ve öğretmenler sandalyeleri doldurdu. Seo-jin projektörün arkasında bekledi. Min-ho ellerini cebine sokmuştu; heyecanlandığında bunu yapıyordu. Yuna son kontrolü yaptı. Işıklar kapandı. İlk görüntü ekrana geldi. Salon sessizleşti. İnsanlar kendi okulunu başka bir gözle görmeye başladı. Video bittiğinde birkaç saniyelik sessizlik oldu. Ardından alkışlar yükseldi.`,
`Beklenmedik mesaj\n\nGösterimin ardından okul müdürü kulüp üyelerini çağırdı. Projenin gelecek yıl da devam etmesini istedi. Ancak en şaşırtıcı şey, müdürün onlara eski medya kulübünün arşivini açacağını söylemesiydi. Arşivde daha fazla kaset vardı. Seo-jin Min-ho'ya baktı. Min-ho kaşlarını kaldırdı. Yuna ise gülmeye başladı. “Sanırım bu hikâye burada bitmiyor.” Arşiv odasının kapısına doğru yürürlerken Seo-jin'in telefonuna bilinmeyen bir numaradan mesaj geldi.`,
`Mesaj\n\nMesajda yalnızca şu yazıyordu: “17 numaralı kaseti izlemeyin.” Seo-jin ekranı Min-ho'ya gösterdi. Yuna hemen telefonunu çıkardı. “Bu şaka mı?” Kimse cevap veremedi. Çünkü üçü de 17 numaralı anahtarın daha önce buldukları anahtarla aynı olduğunu biliyordu. Karar vermek için ertesi güne kadar beklemeye karar verdiler. O gece Seo-jin eve giderken okulun çatısındaki radyoyu düşündü. Radyonun hâlâ çalışıyor olması artık ona tesadüf gibi gelmiyordu.`,
`17 numaralı kaset\n\nErtesi gün kaseti buldular. Üzerinde yalnızca 17 yazıyordu. Yuna açmak istemedi. Min-ho ise önce kaydın içeriğini doğrulamayı önerdi. Sonunda kaseti oynattılar. İlk birkaç saniye sessizlik vardı. Sonra Dae-hyun'un sesi duyuldu. “Eğer biri size bu kaseti izlememenizi söylerse, önce nedenini sorun.” Üçü birbirine baktı. Kayıt devam etti. Dae-hyun, beş yıl önce kulübün neden dağıldığını açıklamaya başladı.`,
`Gerçek neden\n\nKulüp dağılmamıştı. Üyeler farklı projelere ayrılmıştı. Dae-hyun, medya kulübünün yalnızca video çekmekten ibaret olmaması gerektiğini düşünmüştü. Öğrencilerin kendi hikâyelerini anlatabilecekleri bir alan kurmak istemişti. Ancak zaman yetmemişti. 17 numaralı kaset, gelecek ekip için bir mesaj olarak bırakılmıştı. “Bir kulüp, odadan ibaret değildir. İnsanlar birlikte üretmeye devam ettiği sürece yaşar.” Seo-jin kayıt bittiğinde uzun süre konuşmadı.`,
`Yeni kulüp\n\nYuna ertesi gün kulüp panosuna yeni bir ilan astı: “Görünmeyen Hikâyeler için yeni ekip arkadaşları aranıyor.” İlk gün üç kişi geldi. Sonraki gün beş kişi. Bir hafta içinde kulüp odası doldu. Herkes farklı bir fikirle gelmişti. Bir öğrenci kısa film yapmak, biri podcast hazırlamak, biri fotoğraf sergisi düzenlemek istiyordu. Seo-jin bu kalabalığı görünce ilk günkü küçük afişi hatırladı. O zaman yalnızca merak etmişti. Şimdi ise bir şeyin parçası olmuştu.`,
`Min-ho'nun filmi\n\nMin-ho, ilk kez kendi kısa filmini çekmek istedi. Konusu çok basitti: Bir okulun bir gün boyunca çıkardığı sesler. Ayakkabıların koridordaki sesi, zil, kalemlerin masaya bırakılması, yağmur, kahkahalar… Seo-jin ona yardım etti. Filmde konuşma olmayacaktı. Min-ho “Bazı şeyleri kelimeler olmadan da anlatabiliriz,” dedi. Seo-jin kamerayı ona verdi. “O zaman yönetmen sensin.” Min-ho şaşırdı ama kamerayı aldı.`,
`Yuna'nın sergisi\n\nYuna ise eski okul fotoğraflarından küçük bir sergi hazırladı. Her fotoğrafın yanına fotoğraftaki insanların o an hakkında yazdığı kısa bir not koydu. Sergi açıldığında öğrenciler eski sınıflarını, eski arkadaşlarını ve yıllar önceki okul hayatını gördüler. Mira da sergiyi gezdi. Dördüncü kişinin yüzü kapatılmış eski fotoğrafı görünce gülümsedi. “Bunu saklamanız iyi olmuş,” dedi. Yuna nedenini sormadı. Bazı cevapların sorulmadan da anlaşılabileceğini öğrenmişti.`,
`Yazın ortası\n\nAğustos ilerledikçe okul değişmeye başladı. Kulüp odasında artık yalnızca üç kişi yoktu. Duvarlarda yeni fotoğraflar, masalarda senaryolar, bilgisayarlarda montaj dosyaları vardı. Seo-jin bazen ilk günkü hâlini hatırlıyordu. O gün sadece bir afişin fotoğrafını çekmişti. Şimdi o fotoğraf hâlâ telefonundaydı. Fotoğrafı açıp Min-ho'ya gösterdi. “Bunu silmedin mi?” diye sordu. Seo-jin güldü. “İyi ki silmemişim.”`,
`Bir gün, bir hikâye\n\nKulüp üyeleri her hafta bir öğrencinin hikâyesini kaydetmeye başladı. Bazıları komikti, bazıları hüzünlü, bazıları sıradandı. Ama hiçbirinin gereksiz olmadığı ortaya çıktı. Çünkü insanlar dinlendiklerini hissettiklerinde daha cesur konuşuyordu. Seo-jin bunu kameranın arkasında öğrenmişti. Bir gün Yuna ona, “Sen artık görüntü çekmiyorsun, insanları dinliyorsun,” dedi. Seo-jin bunu düşündü. Belki de iyi bir hikâye anlatmanın ilk şartı gerçekten dinlemekti.`,
`Min-ho'nun sessizliği\n\nMin-ho birkaç gün boyunca kendi filmi üzerinde çalıştı ama kimseye göstermedi. Seo-jin nedenini sorduğunda “Henüz hazır değil,” dedi. Ona baskı yapmadı. Bir hafta sonra Min-ho filmi getirdi. Film yalnızca dört dakika uzunluğundaydı. İlk sahnede boş bir sınıf vardı. Son sahnede aynı sınıf öğrencilerle doluydu. Arada yalnızca okulun sesleri vardı. Seo-jin filmi bitirdiğinde “Bu gerçekten güzel,” dedi. Min-ho ilk kez rahatça gülümsedi.`,
`Dae-hyun'un mektubu\n\nArşivde yeni bir zarf buldular. Üzerinde “Gelecek medya kulübüne” yazıyordu. İçinde Dae-hyun'un kısa bir mektubu vardı. Mektupta başarıdan değil, birlikte üretmekten bahsediyordu. Son satırda “Bir gün bu mektubu bulanlar, bizim bıraktığımız yerden değil, kendi istedikleri yerden devam etsin,” yazıyordu. Seo-jin mektubu kapattı. Artık geçmişin onlara bir görev vermediğini anladı. Sadece bir kapı açmıştı.`,
`Yeni proje\n\nKulüp yaz sonu için büyük bir proje planladı. Okulun bütün küçük hikâyelerini tek bir dijital dergide birleştireceklerdi. Fotoğraflar, röportajlar, kısa filmler ve öğrencilerin yazıları aynı yerde olacaktı. Seo-jin tasarımı üstlendi. Min-ho ses kayıtlarını düzenledi. Yuna yazıları topladı. Dae-hyun'un eski kulübünden kalan fikirler artık onların kendi fikirleriyle karışıyordu. Ortaya geçmişe ait olmayan, geleceğe ait yeni bir şey çıkıyordu.`,
`Son haftalar\n\nYazın son haftaları hızlı geçti. Okulun koridorları yeniden kalabalıklaşmaya başladı. Yeni öğrenciler kulübe katıldı. Bazıları ilk başta çekingen davranıyordu. Seo-jin onları rahatlatmak için ilk gün yaşadıklarını anlattı. Bir afiş, bir kamera, eski bir kaset ve dört kelime… Her şey böyle başlamıştı. Min-ho ona baktı. “Dört kelime değil, dört kişi,” dedi. Seo-jin gülümsedi. Artık bu hikâyenin kaç kişiden oluştuğunu saymak mümkün değildi.`,
`Yaz sonu gösterisi\n\nSon gösterim günü tiyatro salonu yine doluydu. Bu kez sahnede yalnızca tek bir projektör değil, bütün ışıklar yanıyordu. Öğrencilerin hazırladığı filmler sırayla gösterildi. Min-ho'nun sessiz filmi büyük alkış aldı. Yuna'nın sergisi salonun yan duvarlarında sergilendi. Seo-jin hazırladığı dijital dergiyi ekrana yansıttı. En son eski kasetten birkaç saniye çaldı. Dae-hyun'un sesi salonda yankılandı. Ardından ekran karardı ve yeni kulübün logosu göründü.`,
`Bir cümle daha\n\nGösterimden sonra herkes sahneden ayrıldı. Seo-jin ışıkları kapatmak için geri döndü. Sahnenin ortasında dört boş fotoğraf çerçevesi duruyordu. Birini aldı ve içinden küçük bir not çıktı: “Başlangıç sandığınız şey bazen yalnızca ikinci bölümdür.” Seo-jin kahkaha attı. Min-ho kapıdan seslendi: “Ne buldun?” Seo-jin notu ona uzattı. Yuna da yanlarına geldi. Üçü aynı anda birbirine baktı.`,
`Yeni okul yılı\n\nEylül geldiğinde okul yeniden hareketlendi. Medya Kulübü artık okulun en aktif kulüplerinden biriydi. Fakat ekip kendini büyük bir başarıya ulaşmış gibi görmüyordu. Hâlâ öğrenecekleri çok şey vardı. Seo-jin yeni üyelerle ilk toplantıyı yaptı. Toplantının sonunda aynı soruyu sordu: “Bir hikâyeyi çekmek isteseydiniz neyi anlatırdınız?” Bu kez cevaplar çok daha fazlaydı. Herkes farklı bir şey söyledi. Seo-jin gülümsedi.`,
`Min-ho'nun cevabı\n\nToplantıdan sonra Min-ho Seo-jin'e yaklaştı. “İlk gün bana bu soruyu sormuştun,” dedi. “Ben mi?” Seo-jin şaşırdı. Min-ho güldü. “Yuna sormuştu ama sen ilk cevap veren kişiydin.” Seo-jin hatırladı. O gün cevap verememişti. Şimdi ise verebiliyordu. “İnsanların birbirini bulmasını anlatmak isterdim,” dedi. Min-ho başını salladı. “O zaman yeni filmimiz belli.”`,
`Yeni film\n\nYeni filmin adı “Bir Yaz Daha” oldu. Bu kez eski gizemlerden söz etmeyeceklerdi. Film, kulübün yeni üyelerinin ilk günlerini anlatacaktı. Kamera yeniden koridorlarda dolaşmaya başladı. İlk günkü heyecan geri gelmişti ama ekip artık ne yaptığını biliyordu. Seo-jin kamerayı yeni üyelerden birine verdi. “Sıra sende.” Çocuk kamerayı dikkatle tuttu. “Ya yanlış yaparsam?” Seo-jin gülümsedi. “Yanlış yapmak da hikâyenin bir parçası.”`,
`Yağmur\n\nBir öğleden sonra yağmur başladı. Herkes kulüp odasına sığındı. Pencereden dışarı bakarken Min-ho eski radyoyu açtı. Radyo cızırtının ardından bir melodi çaldı. Üçü şaşırdı. Melodi yıllar önceki kasette duydukları melodiydi. Ama bu kez eski bir kayıt değildi. Radyo canlı yayın yapıyordu. Spiker okulun medya kulübünden bahsediyordu. Seo-jin kahkaha attı. “Bence artık geçmiş bizi takip etmiyor. Biz geçmişi taşıyoruz.”`,
`Mira'nın vedası\n\nMira şehir dışına taşınmadan önce kulüp odasına geldi. Yanında eski fotoğraf vardı. Fotoğrafı duvara asmak yerine Seo-jin'e verdi. “Bunu saklayın,” dedi. “Ama yüzü kapalı kalsın.” Seo-jin kabul etti. Mira kapıdan çıkmadan önce geriye baktı. “Sizin kulübünüz farklı.” Yuna sordu: “Nasıl?” Mira gülümsedi. “Çünkü siz hikâyelerin sahibi olmak istemiyorsunuz. Onlara eşlik ediyorsunuz.” Bu cümle kulüp odasında uzun süre konuşuldu.`,
`Dört kelime\n\nCesaret. Merak. Dostluk. Başlangıç. Dört kelime hâlâ duvarda asılıydı. Seo-jin bazen bu kelimelerin ilk günkü anlamından farklılaştığını düşünüyordu. Cesaret, yalnızca kamera karşısına geçmek değildi. Merak, gizem aramak değildi. Dostluk, aynı fikirde olmak değildi. Başlangıç ise her zaman ilk gün değildi. Bazen bir şeyin ikinci kez denenmesiydi.`,
`Kapanış\n\nYaz bitmişti. Ama Seo-jin için yazın hikâyesi bitmemişti. Okulun çatısındaki radyo, tiyatro salonundaki ışıklar, eski kasetler ve küçük afiş hâlâ oradaydı. Fakat artık onların anlamını biliyordu. Bunlar geçmişin kapılarıydı; geleceğin yolunu kendileri çizecekti. Min-ho kamerayı kapattı. Yuna ışıkları söndürdü. Üçü birlikte kulüp odasından çıktı. Koridorda yeni öğrencilerin sesleri duyuluyordu.`,
`Son sayfa\n\nSeo-jin kapının yanında durup bir an geriye baktı. Masanın üzerinde ilk gün çektiği afiş fotoğrafı vardı. Fotoğrafı aldı ve kulüp panosuna astı. Altına küçük bir not yazdı: “Her hikâye birinin merak etmesiyle başlar.” Sonra kapıyı kapattı. Koridorda Min-ho ve Yuna onu bekliyordu. Üçü birlikte okuldan çıktı. Seul akşamı ışıklarla doluydu. Yaz bitmişti. Ama onların hikâyesi daha yeni başlıyordu.`
];
