<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEUFREX Memory</title><style>body{margin:0;background:#080813;color:#fff;font-family:Arial;text-align:center}main{max-width:650px;margin:auto;padding:30px 15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{aspect-ratio:1;border:0;border-radius:18px;background:linear-gradient(135deg,#7c5cff,#ff4d91);color:transparent;font-size:32px;cursor:pointer;transition:.3s}.card.open,.card.done{background:#fff;color:#111}.card.open{transform:rotateY(180deg)}button{padding:12px 18px;border:0;border-radius:12px;background:#7c5cff;color:#fff;font-weight:800;cursor:pointer;margin:8px}h1{font-size:38px}@media(max-width:500px){.grid{gap:7px}}</style></head><body><main><h1>🧠 JEUFREX Memory</h1><p id="info">Eşleşen kartları bul!</p><div id="grid" class="grid"></div><button onclick="start()">↻ Yeniden Başlat</button><button onclick="location.href='games.html'">← Oyunlara dön</button></main><script>const icons=['🎵','🎮','🚀','⭐','🎧','⚡','🧩','🎬'];let first=null,lock=false,moves=0;function start(){let a=[...icons,...icons].sort(()=>Math.random()-.5);grid.innerHTML='';first=null;lock=false;moves=0;a.forEach(v=>{let b=document.createElement('button');b.className='card';b.dataset.v=v;b.textContent=v;b.onclick=()=>flip(b);grid.appendChild(b)})}function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.classList.add('open');if(!first){first=b;return}moves++;if(first.dataset.v===b.dataset.v){first.classList.add('done');b.classList.add('done');first=null;if(document.querySelectorAll('.done').length===16){setTimeout(()=>alert('Tebrikler! '+moves+' hamlede bitirdin 🎉'),150)}}else{lock=true;setTimeout(()=>{first.classList.remove('open');b.classList.remove('open');first=null;lock=false},650)}}start()</script></body></html>
