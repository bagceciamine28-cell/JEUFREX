<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEUFREX Clicker</title><style>body{margin:0;background:#070711;color:#fff;font-family:Arial;text-align:center}main{max-width:650px;margin:auto;padding:35px 15px}.coin{width:210px;height:210px;border:0;border-radius:50%;background:linear-gradient(145deg,#ff4d91,#7c5cff);color:#fff;font-size:70px;cursor:pointer;box-shadow:0 20px 70px #7c5cff55;transition:.08s}.coin:active{transform:scale(.92)}.score{font-size:30px;font-weight:900}button.small{padding:12px 18px;border:0;border-radius:12px;background:#ffffff12;color:#fff;font-weight:800;cursor:pointer;margin:12px}h1{font-size:38px}</style></head><body><main><h1>💎 JEUFREX Clicker</h1><p class="score">Puan: <span id="s">0</span></p><button class="coin" id="c">💎</button><br><button class="small" onclick="reset()">↻ Sıfırla</button><button class="small" onclick="location.href='games.html'">← Oyunlara dön</button></main><script>let score=0;c.onclick=()=>{score++;s.textContent=score};function reset(){score=0;s.textContent=0}</script></body></html>
