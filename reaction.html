<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEUFREX Reaction</title><style>body{margin:0;background:#070711;color:#fff;font-family:Arial;text-align:center}main{max-width:650px;margin:auto;padding:35px 15px}.arena{height:430px;border-radius:28px;background:linear-gradient(135deg,#16162c,#0d0d18);border:1px solid #ffffff18;position:relative;overflow:hidden}.target{position:absolute;width:72px;height:72px;border:0;border-radius:50%;background:#ff4d91;box-shadow:0 0 40px #ff4d9180;cursor:pointer;display:none}button.start{padding:13px 22px;border:0;border-radius:13px;background:#7c5cff;color:#fff;font-weight:900;cursor:pointer;margin:12px}h1{font-size:38px}.score{color:#aaa}</style></head><body><main><h1>⚡ JEUFREX Reaction</h1><p class="score">Skor: <b id="s">0</b> • Süre: <b id="t">10</b>s</p><div class="arena" id="a"><button class="target" id="x"></button></div><button class="start" onclick="start()">▶ Başlat</button><button class="start" onclick="location.href='games.html'">← Oyunlara dön</button></main><script>const a=document.getElementById('a'),x=document.getElementById('x'),s=document.getElementById('s'),t=document.getElementById('t');let score,time,timer;function start(){score=0;time=10;s.textContent=0;t.textContent=10;x.style.display='block';move();clearInterval(timer);timer=setInterval(()=>{time--;t.textContent=time;if(time<=0){clearInterval(timer);x.style.display='none';alert('Süren bitti! Skorun: '+score)}},1000)}function move(){x.style.left=Math.random()*(a.clientWidth-72)+'px';x.style.top=Math.random()*(a.clientHeight-72)+'px'}x.onclick=e=>{e.stopPropagation();score++;s.textContent=score;move()}</script></body></html>
