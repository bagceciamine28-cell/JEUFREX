<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit | JEUFREX</title><style>body{margin:0;background:#070711;color:white;font:16px Arial;text-align:center}main{max-width:700px;margin:30px auto;padding:20px}canvas{width:100%;background:#101020;border-radius:25px;touch-action:none}.b{padding:12px 20px;border:0;border-radius:12px;font-weight:bold}</style><main><h1>🪐 Orbit</h1><p>Gezegenleri merkeze çarptırmadan yörüngede tut!</p><canvas id="c" width="650" height="500"></canvas><p id="s">Skor: 0</p><button class="b" onclick="start()">Başlat</button></main><script>let c=document.querySelector('#c'),x=c.getContext('2d'),a=0,score=0,run=false,raf;function start(){a=0;score=0;run=true;loop()}function loop(){x.fillStyle='#101020';x.fillRect(0,0,650,500);x.fillStyle='#ff5';x.beginPath();x.arc(325,250,35,0,7);x.fill();a+=.035;let r=130+Math.sin(a*2)*25;let px=325+Math.cos(a)*r,py=250+Math.sin(a)*r;x.fillStyle='#70eaff';x.beginPath();x.arc(px,py,16,0,7);x.fill();score++;document.querySelector('#s').textContent='Skor: '+Math.floor(score/10);if(r<60){run=false;alert('💥 Yörünge çöktü! Skor: '+Math.floor(score/10));return}raf=requestAnimationFrame(loop)}c.onclick=()=>{if(run)a+=.45}</script>
