<script>

/* ==================================================

const SUPABASE_URL =

*/

const SUPABASE_KEY =
"sb_publishable_C0BYpv-9sknEu1EXbeKLwQ_lMddpL5V";

const supabaseClient =
window.supabase.createClient(

);


/* ==================================================
   ELEMENTLER
================================================== */

const historyElement =
document.getElementById("history");

const messagesElement =
document.getElementById("messages");

const input =
document.getElementById("input");

const sendButton =
document.getElementById("sendButton");

const newChatButton =

const chatTitle =

let currentUser = null;
let currentChatId = null;


/* ==================================================

================================================== */

async function checkUser() {

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if (error || !data.user) {

    window.location.replace("login.html");

    return false;
  }

  currentUser = data.user;

  return true;
}


/* ==================================================
   SOHBET GEÇMİŞİ
================================================== */

async function loadChats() {

  historyElement.innerHTML = "";

  const {
    data,
    error
  } = await supabaseClient
    .from("jeo_chats")
    .select("id,title,created_at")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    historyElement.innerHTML =
      "<p style='padding:15px;color:red'>Sohbetler yüklenemedi.</p>";

    return;
  }

  if (!data || data.length === 0) {

    historyElement.innerHTML =
      "<p style='padding:15px;color:#888;font-size:13px'>Henüz sohbet yok.</p>";

    return;
  }

  data.forEach(chat => {

    const row =
      document.createElement("div");

    row.className =
      "chat-row";

    const button =
      document.createElement("button");

    button.className =
      "chat-item";

    if (chat.id === currentChatId) {
      button.classList.add("active");
    }

    button.textContent =
      "💬 " + (chat.title || "Yeni Sohbet");

    button.onclick =
      () => loadChat(chat.id);

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-chat";

    deleteButton.textContent =
      "🗑️";

    deleteButton.title =
      "Sohbeti sil";

    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteChat(chat.id);
      };

    row.appendChild(button);
    row.appendChild(deleteButton);

    historyElement.appendChild(row);

  });
}


/* ==================================================
   YENİ SOHBET
================================================== */

async function createChat() {

  const {
    data,
    error
  } = await supabaseClient
    .from("jeo_chats")
    .insert({
      user_id: currentUser.id,
      title: "Yeni Sohbet"
    })
    .select()
    .single();

  if (error) {

    console.error(error);

  `;

  input.focus();

/* ==================================================
   SOHBET SİL
================================================== */

async function deleteChat(chatId) {

  const confirmed =
    confirm(
      "Bu sohbeti ve mesajlarını silmek istediğine emin misin?"
    );

  if (!confirmed)
    return;

  await supabaseClient
    .from("jeo_messages")
    .delete()
    .eq("chat_id", chatId)
    .eq("user_id", currentUser.id);

  const {
    error
  } = await supabaseClient
    .from("jeo_chats")
    .delete()
    .eq("id", chatId)
    .eq("user_id", currentUser.id);

  if (error) {

    alert(
      "Sohbet silinemedi: " +
      error.message
    );

    return;
  }

  if (currentChatId === chatId) {

    currentChatId = null;

    chatTitle.textContent =
      "JEO 🤖";

    messagesElement.innerHTML = `
      <div class="empty">
        <h1>🤖</h1>
        <p>
          Sohbet silindi.<br>
          Yeni bir sohbet başlatabilirsin.
        </p>
      </div>
    `;
  }

  await loadChats();
}


/* ==================================================
   SOHBETİ AÇ
================================================== */

async function loadChat(chatId) {

  currentChatId =
    chatId;

  const {
    data: chat,
    error: chatError
  } = await supabaseClient
    .from("jeo_chats")
    .select("*")
    .eq("id", chatId)
    .eq("user_id", currentUser.id)
    .single();

  if (chatError || !chat) {

    console.error(chatError);

    return;
  }

  chatTitle.textContent =
    chat.title + " 🤖";

  const {
    data: messages,
    error
  } = await supabaseClient
    .from("jeo_messages")
    .select("*")
    .eq("chat_id", chatId)
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending: true
    });

  if (error) {

    console.error(error);

    return;
  }

  messagesElement.innerHTML = "";

  if (!messages || messages.length === 0) {

    messagesElement.innerHTML = `
      <div class="empty">
        <h1>🤖</h1>
        <p>
          Bu sohbette henüz mesaj yok.
        </p>
      </div>
    `;

  } else {

    messages.forEach(message => {

      addMessageToScreen(
        message.role,
        message.content
      );

    });
  }

  await loadChats();
}


/* ==================================================
   MESAJI EKRANA EKLE
================================================== */

function addMessageToScreen(
  role,
  content
) {

  const empty =
    messagesElement.querySelector(".empty");

  if (empty)
    empty.remove();

  const message =
    document.createElement("div");

  message.className =
    "message " + role;

  message.textContent =
    content;

  messagesElement.appendChild(
    message
  );

  messagesElement.scrollTop =
    messagesElement.scrollHeight;
}


/* ==================================================
   MATEMATİK MOTORU
================================================== */

function calculateMath(text) {

  let expression =
    text
      .replace(/kaç eder/gi, "")
      .replace(/hesapla/gi, "")
      .replace(/nedir/gi, "")
      .replace(/=/g, "")
      .trim();

  if (
    !/^[0-9+\-*/().%\s]+$/.test(expression)
  ) {
    return null;
  }

  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    if (
      typeof result === "number" &&
      Number.isFinite(result)
    ) {

      return result;
    }

  } catch (error) {

    return null;
  }

  return null;
}


/* ==================================================
   YÜZDE HESAPLAMA
================================================== */

function calculatePercentage(text) {

  const match =
    text.match(
      /([0-9]+(?:\.[0-9]+)?)\s*%\s*(?:si|ü|üzerinden)?\s*([0-9]+(?:\.[0-9]+)?)/i
    );

  if (!match)
    return null;

  const percent =
    Number(match[1]);

  const number =
    Number(match[2]);

  return number * percent / 100;
}

const JEO_KNOWLEDGE = {

};


/* ==================================================
   JEO BEYNİ
================================================== */

function jeoAnswer(question) {

  const q =
    question
      .toLowerCase()
      .trim();


  /* MATEMATİK */

  const math =
    calculateMath(q);

  if (math !== null) {

    return (
      "🧮 Sonuç: " +
      math
    );
  }


  /* YÜZDE */

  const percentage =
    calculatePercentage(q);

  if (percentage !== null) {

    return (
      "🧮 Sonuç: " +
      percentage
    );
  }


  /* SELAM */

  if (
    q === "merhaba" ||
    q === "selam" ||
    q === "sa" ||
    q.includes("merhaba jeo") ||
    q.includes("selam jeo")
  ) {

    return (
      "Merhaba! 👋\n\n" +
      "Ben JEO 🤖\n" +
      "JEUFREX'in kendi yapay zekâ asistanıyım.\n\n" +
      "Bana matematik sorabilir veya sohbet edebilirsin."
    );
  }


  /* KİMSİN */

  if (
    q.includes("kimsin") ||
    q.includes("sen nesin") ||
    q.includes("j.e.o")
  ) {

    return JEO_KNOWLEDGE.jeo;
  }


  /* JEUFREX */

  if (
    q.includes("jeufrex")
  ) {

    return JEO_KNOWLEDGE.jeufrex;
  }


  /* MATEMATİK */

  if (
    q.includes("matematik") ||
    q.includes("hesap")
  ) {

    return JEO_KNOWLEDGE.matematik;
  }


  /* MÜZİK */

  if (
    q.includes("müzik") ||
    q.includes("şarkı")
  ) {

    return JEO_KNOWLEDGE.müzik;
  }


  /* YARDIM */

  if (
    q === "yardım" ||
    q === "help" ||
    q.includes("ne yapabiliyorsun")
  ) {

    return JEO_KNOWLEDGE.yardım;
  }


  /* TEŞEKKÜR */

  if (
    q.includes("teşekkür") ||
    q.includes("sağ ol") ||
    q.includes("eyvallah")
  ) {

    return "Rica ederim! 😎🚀";
  }


  /* GÜZEL SÖZ */

  if (
    q.includes("nasılsın") ||
    q.includes("nasılsın jeo")
  ) {

    return (
      "Gayet iyiyim! 🤖🔥\n\n" +
      "Kodlar çalışıyor, veritabanı hazır ve beni geliştirmeye devam ediyoruz."
    );
  }


  /* GENEL */

  return (
    "🤔 Bu konuda henüz yeterli bilgim yok.\n\n" +
    "Ama JEO'nun olayı zaten burada başlıyor. 🚀\n\n" +
    "Bana daha fazla bilgi tabanı ekleyerek beni adım adım geliştirebiliriz."
  );
}

/* ==================================================
   MESAJ GÖNDER
================================================== */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text)
    return;


  /* Sohbet yoksa oluştur */

  if (!currentChatId) {

    await createChat();

    if (!currentChatId)
      return;
  }


  input.value = "";

  sendButton.disabled = true;


  addMessageToScreen(
    "user",
    text
  );


  /* Kullanıcı mesajı */

  const {
    error: userError
  } = await supabaseClient
    .from("jeo_messages")
    .insert({

      chat_id:
        currentChatId,

      user_id:
        currentUser.id,

      role:
        "user",

      content:
        text

    });


  if (userError) {

    console.error(userError);
  }


  /* JEO düşünüyor */

  showTyping();


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        500
      )
  );


  const answer =
    jeoAnswer(text);


  removeTyping();


  addMessageToScreen(
    "assistant",
    answer
  );


  /* Cevabı kaydet */

  const {
    error: assistantError
  } = await supabaseClient
    .from("jeo_messages")
    .insert({

      chat_id:
        currentChatId,

      user_id:
        currentUser.id,

      role:
        "assistant",

      content:
        answer

    });


  if (assistantError) {

    console.error(
      assistantError
    );
  }


  /* Başlık oluştur */

  const {
    data: chat
  } = await supabaseClient
    .from("jeo_chats")
    .select("title")
    .eq(
      "id",
      currentChatId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .single();


  if (
    chat &&
    chat.title === "Yeni Sohbet"
  ) {

    let title =
      text.substring(0, 32);

    if (text.length > 32) {
      title += "...";
    }

    await supabaseClient
      .from("jeo_chats")
      .update({
        title: title
      })
      .eq(
        "id",
        currentChatId
      )
      .eq(
        "user_id",
        currentUser.id
      );

    chatTitle.textContent =
      title + " 🤖";

    await loadChats();
  }


  sendButton.disabled = false;

  input.focus();
}


/* ==================================================

      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

/* ==================================================

================================================== */

async function start() {

}

start();
