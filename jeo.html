<main>

  <section class="ai-card">

    <div class="ai-header">

      <div class="robot">
        🤖

    <div id="chat">

      <div class="message jeo">

        Bana bir şey sorabilirsin!
      </div>

      </button>

<script>

  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");


  // ==========================================
  // MESAJ EKLE
  // ==========================================

  function addMessage(text, type) {

    const message =
      document.createElement("div");

    message.className =
      "message " + type;

    message.textContent =
      text;

    chat.appendChild(message);

    chat.scrollTop =
      chat.scrollHeight;
  }


  // ==========================================
  // BASİT MATEMATİK MOTORU
  // ==========================================

  function calculateMath(text) {

    const cleaned =
      text
        .replace(/kaç eder/gi, "")
        .replace(/kaçtır/gi, "")
        .replace(/hesapla/gi, "")
        .replace(/=/g, "")
        .trim();

    if (
      /^[0-9+\-*/().%\s]+$/.test(cleaned)
    ) {

      try {

        const result =
          Function(
            '"use strict"; return (' +
            cleaned +
            ')'
          )();

        if (
          Number.isFinite(result)
        ) {
          return result;
        }

      } catch (error) {

        return null;

      }
    }

    return null;
  }


  // ==========================================
  // JEO'NUN BEYNİ
  // ==========================================

  function getJEOResponse(text) {

    const lower =
      text
        .toLowerCase()
        .trim();


    // Selamlaşma

    if (
      lower.includes("merhaba") ||
      lower.includes("selam") ||
      lower.includes("hey") ||
      lower.includes("sa")
    ) {

      return "Merhaba! 👋 Ben JEO. Nasılsın? 🤖";

    }


    // JEO

    if (
      lower.includes("sen kimsin") ||
      lower.includes("jeo kimsin") ||
      lower.includes("jeo nedir")
    ) {

      return "Ben JEO! 🤖 JEUFREX için geliştirilen kendi yapay zekâ asistanıyım.";

    }


    // JEUFREX

    if (
      lower.includes("jeufrex nedir") ||
      lower.includes("jeufrex ne")
    ) {

      return "JEUFREX; oyun, müzik, video, topluluk ve daha fazlasını bir araya getiren bir platform. 🚀";

    }


    // Şaka

    if (
      lower.includes("şaka") ||
      lower.includes("espri")
    ) {

      return "Bilgisayar neden doktora gitmiş? 😄 Çünkü virüs kapmış! 🦠😂";

    }


    // Teşekkür

    if (
      lower.includes("teşekkür") ||
      lower.includes("sağ ol")
    ) {

      return "Rica ederim! 😎🤖";

    }


    // Matematik

    const mathResult =
      calculateMath(lower);

    if (
      mathResult !== null
    ) {

      return "Sonuç: " + mathResult + " 🧮";

    }


    // Müzik

    if (
      lower.includes("müzik") ||
      lower.includes("şarkı")
    ) {

      return "🎵 JEUFREX Müzik bölümüne bakabilirsin. Admin Originals burada seni bekliyor!";

    }


    // Oyun

    if (
      lower.includes("oyun")
    ) {

      return "🎮 JEUFREX'teki Oyunlar bölümüne göz atabilirsin!";

    }


    // Yardım

    if (
      lower.includes("yardım") ||
      lower.includes("ne yapabiliyorsun")
    ) {

      return "Şimdilik sohbet edebilir, basit matematik işlemleri yapabilir, JEUFREX hakkında bilgi verebilir ve küçük şakalar yapabilirim. 🤖";

    }


    // Bilinmeyen

    return "Hmm 🤔 Bunu henüz öğrenmedim. Ben JEO'nun ilk sürümüyüm! Bana daha fazla bilgi öğretebiliriz. 🧠";

  }


  // ==========================================
  // MESAJ GÖNDER
  // ==========================================

  function sendMessage() {

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    addMessage(
      text,
      "user"
    );


    input.value = "";


    // Küçük düşünme efekti

    sendButton.disabled =
      true;

    sendButton.textContent =
      "...";


    setTimeout(
      function() {

        const response =
          getJEOResponse(text);

        addMessage(
          response,
          "jeo"
        );

        sendButton.disabled =
          false;

        sendButton.textContent =
          "Gönder";

        input.focus();

      },
      350
    );

  }


  // ==========================================
  // ENTER
  // ==========================================

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        sendMessage();

      }

    }
  );


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  // ==========================================
  // HIZLI MESAJ
  // ==========================================

  function quickMessage(text) {

    input.value =
      text;

    sendMessage();

  }

</script>
