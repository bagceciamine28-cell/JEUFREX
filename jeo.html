<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta

  content="width=device-width, initial-scale=1.0"
>

<title>JEO | JEUFREX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #171717;
  height: 100vh;
  overflow: hidden;
}

/* =========================
   HEADER
========================= */

header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #e5e5e5;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 25px;

  position: relative;
  z-index: 5;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  text-decoration: none;
  color: #111;
}

nav {
  display: flex;
  gap: 18px;
}

nav a {
  text-decoration: none;
  color: #555;
  font-weight: 700;
  font-size: 13px;
}

nav a:hover {
  color: #000;
}

/* =========================
   APP
========================= */

.app {
  height: calc(100vh - 65px);
  display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 280px;
  background: white;
  border-right: 1px solid #e5e5e5;

  display: flex;
  flex-direction: column;
}

.sidebar-top {
  padding: 20px;
}

.jeo-title {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 15px;
}

.new-chat {
  width: 100%;
  border: none;
  background: #111;
  color: white;

  padding: 13px;
  border-radius: 12px;

  font-weight: 800;
  cursor: pointer;
}

.new-chat:hover {
  opacity: .9;
}

.history-title {
  padding: 10px 20px;
  color: #888;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.history {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 20px;
}

.chat-item {
  width: 100%;
  border: none;
  background: transparent;

  padding: 12px;
  border-radius: 10px;

  text-align: left;

  cursor: pointer;
  font-weight: 700;

  color: #333;

  margin-bottom: 4px;
}

.chat-item:hover {
  background: #f1f1f1;
}

.chat-item.active {
  background: #111;
  color: white;
}

/* =========================
   CHAT
========================= */

.chat-area {
  flex: 1;

  display: flex;
  flex-direction: column;

  min-width: 0;
}

.chat-header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #e5e5e5;

  display: flex;
  align-items: center;

  padding: 0 25px;

  font-weight: 900;
}

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 30px;

  display: flex;
  flex-direction: column;

  gap: 15px;
}

/* =========================
   MESSAGE
========================= */

.message {
  max-width: 750px;
  padding: 15px 18px;

  border-radius: 18px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}

.message.user {
  align-self: flex-end;

  background: #111;
  color: white;

  border-bottom-right-radius: 5px;
}

.message.assistant {
  align-self: flex-start;

  background: white;

  border: 1px solid #e5e5e5;

  border-bottom-left-radius: 5px;
}

/* =========================
   INPUT
========================= */

.input-area {
  background: white;

  border-top: 1px solid #e5e5e5;

  padding: 15px;

  display: flex;
  gap: 10px;
}

.input-area textarea {
  flex: 1;

  resize: none;

  min-height: 50px;
  max-height: 140px;

  border: 1px solid #ddd;

  border-radius: 14px;

  padding: 14px;

  font-family: Arial;

  outline: none;
}

.input-area textarea:focus {
  border-color: #111;
}

.send {
  width: 55px;

  border: none;

  border-radius: 14px;

  background: #111;

  color: white;

  font-size: 20px;

  cursor: pointer;
}

.send:hover {
  opacity: .9;
}

/* =========================
   EMPTY
========================= */

.empty {
  margin: auto;

  text-align: center;

  color: #777;
}

.empty h1 {
  color: #111;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

  header {
    padding: 0 15px;
  }

  nav {
    display: none;
  }

  .sidebar {
    width: 220px;
  }

  .messages {
    padding: 15px;
  }

}

@media (max-width: 550px) {

  .sidebar {
    display: none;
  }

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
JEUFREX
</a>

<nav>

<a href="index.html">Ana Sayfa</a>

<a href="games.html">🎮 Oyunlar</a>

<a href="music.html">🎵 Müzik</a>

<a href="videos.html">🎬 Videolar</a>

<a href="community.html">👥 Topluluk</a>

<a href="explore.html">✨ Keşfet</a>

</nav>

</header>


<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

<div class="sidebar-top">

<div class="jeo-title">
🤖 JEO
</div>

<button
  class="new-chat"
  id="newChatButton"
>
➕ Yeni Sohbet
</button>

</div>


<div class="history-title">
Geçmiş Sohbetler
</div>


<div
  class="history"
  id="history"
></div>

</aside>


<!-- =========================
     CHAT
========================= -->

<section class="chat-area">

<div
  class="chat-header"
  id="chatTitle"
>
JEO 🤖
</div>


<div
  class="messages"
  id="messages"
>

<div class="empty">

<h1>
🤖 JEO
</h1>

<p>
Merhaba! Ben JEO.<br>
JEUFREX'in kendi yapay zekâ asistanıyım.
</p>

</div>

</div>


<div class="input-area">

<textarea
  id="input"
  placeholder="JEO'ya bir şey sor..."
></textarea>

<button
  class="send"
  id="sendButton"
>
➤
</button>

</div>

</section>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://cqxxobmvycesunyxicjj.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHhvYm12eWNlc3VueXhpY2pqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzY1NDczMiwiZXhwIjoyMTAzMjMwNzMyfQ.fERQP3ap0bpISrFTlgf6-vWLbu7Rj1uYPzZdypEgZ7k";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   ELEMENTLER
========================================== */

const historyElement =
document.getElementById("history");

const messagesElement =
document.getElementById("messages");

const input =
document.getElementById("input");

const sendButton =
document.getElementById("sendButton");

const newChatButton =
document.getElementById("newChatButton");

const chatTitle =
document.getElementById("chatTitle");


let currentUser = null;
let currentChatId = null;


/* ==========================================
   GİRİŞ KONTROLÜ
========================================== */

async function checkUser() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if (
    error ||
    !data.user
  ) {

    window.location.href =
      "login.html";

    return false;

  }

  currentUser =
    data.user;

  return true;

}


/* ==========================================
   SOHBETLERİ GETİR
========================================== */

async function loadChats() {

  historyElement.innerHTML =
    "";

  const {
    data,
    error
  } =
  await supabaseClient
    .from("jeo_chats")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );

  if (error) {

    console.error(error);

    historyElement.innerHTML =
      "<p style='padding:15px;color:red'>Sohbetler yüklenemedi.</p>";

    return;

  }


  if (!data.length) {

    historyElement.innerHTML =
      "<p style='padding:15px;color:#888;font-size:13px'>Henüz sohbet yok.</p>";

    return;

  }


  data.forEach(chat => {

    const button =
      document.createElement("button");

    button.className =
      "chat-item";

    button.textContent =
      "💬 " + chat.title;

    button.onclick =
      () => loadChat(chat.id);

    if (
      chat.id === currentChatId
    ) {

      button.classList.add(
        "active"
      );

    }

    historyElement.appendChild(
      button
    );

  });

}


/* ==========================================
   YENİ SOHBET
========================================== */

async function createChat() {

  const {
    data,
    error
  } =
  await supabaseClient
    .from("jeo_chats")
    .insert({

      user_id:
        currentUser.id,

      title:
        "Yeni Sohbet"

    })
    .select()
    .single();


  if (error) {

    console.error(error);

    alert(
      "Sohbet oluşturulamadı:\n" +
      error.message
    );

    return;

  }


  currentChatId =
    data.id;

  chatTitle.textContent =
    "Yeni Sohbet 🤖";

  messagesElement.innerHTML =
    `
    <div class="empty">
      <h1>🤖 JEO</h1>
      <p>
        Yeni sohbet başladı.<br>
        Sana nasıl yardımcı olabilirim?
      </p>
    </div>
    `;


  await loadChats();

}


/* ==========================================
   SOHBETİ AÇ
========================================== */

async function loadChat(
  chatId
) {

  currentChatId =
    chatId;


  const {
    data: chat,
    error: chatError
  } =
  await supabaseClient
    .from("jeo_chats")
    .select("*")
    .eq(
      "id",
      chatId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .single();


  if (
    chatError ||
    !chat
  ) {

    console.error(chatError);

    return;

  }


  chatTitle.textContent =
    chat.title + " 🤖";


  const {
    data: messages,
    error
  } =
  await supabaseClient
    .from("jeo_messages")
    .select("*")
    .eq(
      "chat_id",
      chatId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    return;

  }


  messagesElement.innerHTML =
    "";


  if (!messages.length) {

    messagesElement.innerHTML =
      `
      <div class="empty">

      <h1>🤖 JEO</h1>

      <p>
      Bu sohbette henüz mesaj yok.
      </p>

      </div>
      `;

  }


  messages.forEach(message => {

    addMessageToScreen(
      message.role,
      message.content
    );

  });


  await loadChats();

}


/* ==========================================
   EKRANA MESAJ
========================================== */

function addMessageToScreen(
  role,
  content
) {

  const message =
    document.createElement("div");

  message.className =
    "message " + role;

  message.textContent =
    content;

  messagesElement.appendChild(
    message
  );

  messagesElement.scrollTop =
    messagesElement.scrollHeight;

}


/* ==========================================
   MATEMATİK
========================================== */

function calculateMath(
  text
) {

  let expression =
    text
      .replace(/kaç eder/gi, "")
      .replace(/hesapla/gi, "")
      .replace(/=/g, "")
      .trim();


  if (
    !/^[0-9+\-*/().%\s]+$/.test(
      expression
    )
  ) {

    return null;

  }


  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    if (
      typeof result ===
      "number" &&
      Number.isFinite(result)
    ) {

      return result;

    }

  }

  catch (error) {

    return null;

  }

  return null;

}


/* ==========================================
   JEO BEYNİ
========================================== */

function jeoAnswer(
  question
) {

  const q =
    question
      .toLowerCase()
      .trim();


  /* MATEMATİK */

  const math =
    calculateMath(q);

  if (
    math !== null
  ) {

    return (
      "🧮 Sonuç: " +
      math
    );

  }


  /* SELAM */

  if (
    q.includes("merhaba") ||
    q.includes("selam") ||
    q.includes("sa")
  ) {

    return (
      "Merhaba! 👋 Ben JEO. " +
      "JEUFREX için geliştirilen kendi yapay zekâ asistanınım."
    );

  }


  /* KİMSİN */

  if (
    q.includes("kimsin") ||
    q.includes("sen nesin")
  ) {

    return (
      "Ben JEO 🤖\n\n" +
      "JEUFREX'in kendi yapay zekâ asistanıyım. " +
      "Şu anda temel cevap motorumu geliştiriyoruz."
    );

  }


  /* JEUFREX */

  if (
    q.includes("jeufrex")
  ) {

    return (
      "JEUFREX, kendi oyunlarını, müziklerini, videolarını " +
      "ve topluluk özelliklerini bir araya getiren bir platform."
    );

  }


  /* YARDIM */

  if (
    q === "yardım" ||
    q === "help" ||
    q.includes("ne yapabiliyorsun")
  ) {

    return (
      "Şu anda şunları yapabiliyorum:\n\n" +
      "🧮 Basit matematik işlemleri\n" +
      "💬 Temel sorulara cevap verme\n" +
      "🤖 JEO hakkında bilgi\n" +
      "🎵 JEUFREX hakkında bilgi\n\n" +
      "Beni geliştirmeye devam ediyoruz! 🚀"
    );

  }


  /* TEŞEKKÜR */

  if (
    q.includes("teşekkür") ||
    q.includes("sağ ol")
  ) {

    return (
      "Rica ederim! 😎"
    );

  }


  /* BİLİNMEYEN */

  return (
    "🤔 Bunu henüz bilmiyorum.\n\n" +
    "Ama sorun değil — JEO'yu adım adım " +
    "kendi bilgi tabanımızla geliştireceğiz. 🚀"
  );

}


/* ==========================================
   MESAJ GÖNDER
========================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text)
    return;


  /* Sohbet yoksa oluştur */

  if (!currentChatId) {

    await createChat();

  }


  input.value =
    "";


  addMessageToScreen(
    "user",
    text
  );


  /* Kullanıcı mesajını kaydet */

  const {
    error: userError
  } =
  await supabaseClient
    .from("jeo_messages")
    .insert({

      chat_id:
        currentChatId,

      user_id:
        currentUser.id,

      role:
        "user",

      content:
        text

    });


  if (userError) {

    console.error(
      userError
    );

  }


  /* JEO cevabı */

  const answer =
    jeoAnswer(text);


  setTimeout(
    async () => {

      addMessageToScreen(
        "assistant",
        answer
      );


      await supabaseClient
        .from("jeo_messages")
        .insert({

          chat_id:
            currentChatId,

          user_id:
            currentUser.id,

          role:
            "assistant",

          content:
            answer

        });


      /* İlk mesajdan sohbet başlığı */

      const {
        data: chat
      } =
      await supabaseClient
        .from("jeo_chats")
        .select("title")
        .eq(
          "id",
          currentChatId
        )
        .single();


      if (
        chat &&
        chat.title ===
        "Yeni Sohbet"
      ) {

        let title =
          text.substring(
            0,
            30
          );

        if (
          text.length > 30
        ) {

          title +=
            "...";

        }


        await supabaseClient
          .from("jeo_chats")
          .update({
            title:
              title
          })
          .eq(
            "id",
            currentChatId
          )
          .eq(
            "user_id",
            currentUser.id
          );


        await loadChats();

      }

    },
    300
  );

}


/* ==========================================
   BUTONLAR
========================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


newChatButton.addEventListener(
  "click",
  createChat
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ==========================================
   BAŞLAT
========================================== */

async function start() {

  const loggedIn =
    await checkUser();

  if (!loggedIn)
    return;


  await loadChats();

}


start();

</script>

</body>

</html>
