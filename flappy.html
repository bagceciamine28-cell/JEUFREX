<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEUFREX Flappy</title><style>body{margin:0;background:#080813;color:#fff;font-family:Arial;text-align:center}main{max-width:620px;margin:auto;padding:25px 15px}canvas{width:100%;max-width:560px;border-radius:22px;border:2px solid #ff4d91;background:#15152b}button{padding:12px 20px;border:0;border-radius:12px;background:#ff4d91;color:#fff;font-weight:800;cursor:pointer;margin:8px}h1{font-size:38px}</style></head><body><main><h1>🐤 JEUFREX Flappy</h1><p>Boşluk tuşuna veya ekrana tıkla!</p><canvas id="c" width="560" height="650"></canvas><br><button onclick="reset()">▶ Yeniden Başlat</button><button onclick="location.href='games.html'">← Oyunlara dön</button></main><script>const c=document.getElementById('c'),g=c.getContext('2d');let bird,pipes,score,over,last;function reset(){bird={x:100,y:300,v:0};pipes=[];score=0;over=false;last=0;requestAnimationFrame(loop)}function flap(){if(over)return reset();bird.v=-7.5}document.onkeydown=e=>{if(e.code==='Space')flap()};c.onclick=flap;function loop(t){if(over)return;let dt=Math.min((t-last)/16,2);last=t;bird.v+=.38*dt;bird.y+=bird.v*dt;if(!pipes.length||pipes[pipes.length-1].x<300)pipes.push({x:570,gap:180+Math.random()*250,h:90+Math.random()*170,passed:false});pipes.forEach(p=>p.x-=3*dt);pipes=pipes.filter(p=>p.x>-70);pipes.forEach(p=>{if(!p.passed&&p.x+60<bird.x){score++;p.passed=true}});let hit=bird.y<0||bird.y+28>650||pipes.some(p=>bird.x+28>p.x&&bird.x<p.x+60&&(bird.y<p.h||bird.y+28>p.h+p.gap));draw();if(hit){over=true;setTimeout(()=>alert('Oyun bitti! Skor: '+score),20)}else requestAnimationFrame(loop)}function draw(){g.clearRect(0,0,560,650);g.fillStyle='#11152b';g.fillRect(0,0,560,650);g.fillStyle='#7c5cff';pipes.forEach(p=>{g.fillRect(p.x,0,60,p.h);g.fillRect(p.x,p.h+p.gap,60,650)});g.fillStyle='#ff4d91';g.beginPath();g.arc(bird.x,bird.y,15,0,7);g.fill();g.fillStyle='#fff';g.font='bold 32px Arial';g.fillText(score,20,45)}reset()</script></body></html>
