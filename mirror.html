<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirror Mind | JEUFREX</title><style>body{margin:0;background:#080814;color:#fff;font:16px Arial;text-align:center}main{max-width:650px;margin:35px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cell{height:80px;border:0;border-radius:18px;background:#17172e;color:#fff;font-size:28px;cursor:pointer}.hot{background:#ff5ca8}.b{padding:12px 20px;border:0;border-radius:12px;font-weight:bold;margin:20px}</style><main><h1>🪞 Mirror Mind</h1><p>Kısa süre görünen aynayı yeniden kur.</p><div id="g" class="grid"></div><p id="s">Hazır</p><button class="b" onclick="start()">Başlat</button></main><script>let g=document.querySelector('#g'),s=document.querySelector('#s'),target=[],pick=[];for(let i=0;i<16;i++){let b=document.createElement('button');b.className='cell';b.onclick=()=>{if(target.includes(i)){pick.push(i);b.classList.add('hot');if(pick.length===target.length)s.textContent='🎉 Aynayı tamamladın!'}else s.textContent='❌ O kare değildi!';};g.append(b)}function start(){pick=[];target=[];[...g.children].forEach(b=>{b.className='cell';b.textContent=''});while(target.length<5) {let n=Math.floor(Math.random()*16);if(!target.includes(n))target.push(n)}target.forEach(i=>g.children[i].classList.add('hot'));s.textContent='Hatırla!';setTimeout(()=>{target.forEach(i=>g.children[i].classList.remove('hot'));s.textContent='Şimdi aynısını bul!'},1200)}</script>
