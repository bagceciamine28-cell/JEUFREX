<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Catch | JEUFREX</title><style>body{margin:0;background:#070711;color:white;font:16px Arial;text-align:center}main{max-width:650px;margin:35px auto;padding:20px}.ring{margin:50px auto;width:220px;height:220px;border:10px solid #26264b;border-radius:50%;position:relative}.core{position:absolute;inset:70px;border-radius:50%;background:#ff5ca8;box-shadow:0 0 50px #ff5ca8;cursor:pointer}.b{padding:12px 20px;border:0;border-radius:12px;font-weight:bold}</style><main><h1>💓 Pulse Catch</h1><p>Halka küçülürken doğru anda çekirdeğe dokun.</p><div class="ring"><div class="core" onclick="hit()"></div></div><p id="s">Hazır</p><button class="b" onclick="start()">Başlat</button></main><script>let size=220,t,score=0;function start(){score=0;size=220;clearInterval(t);t=setInterval(()=>{size-=2;document.querySelector('.ring').style.width=size+'px';document.querySelector('.ring').style.height=size+'px';if(size<55){clearInterval(t);document.querySelector('#s').textContent='💥 Kaçırdın! Skor '+score}},80)}function hit(){if(size>90&&size<135){score++;document.querySelector('#s').textContent='✨ Tam isabet! '+score;size=220}else document.querySelector('#s').textContent='⏱️ Zamanlamayı tuttur!'}</script>
