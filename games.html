<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oyunlar | JEUFREX</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #111;
}

header {
  height: 70px;
  background: white;
  border-bottom: 1px solid #e5e5e5;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 35px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  text-decoration: none;
  color: #111;
}

nav {
  display: flex;
  gap: 18px;
}

nav a {
  text-decoration: none;
  color: #555;
  font-weight: 700;
  font-size: 14px;
}

nav a:hover {
  color: #000;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 45px 20px;
}

.hero {
  background: #111;
  color: white;
  border-radius: 25px;
  padding: 40px;
  margin-bottom: 30px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 36px;
}

.hero p {
  margin: 0;
  color: #ccc;
}

.games {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.game {
  background: white;
  border-radius: 22px;
  padding: 25px;
  text-decoration: none;
  color: #111;

  box-shadow: 0 8px 30px rgba(0,0,0,.05);

  transition: .2s;
}

.game:hover {
  transform: translateY(-6px);
  box-shadow: 0 15px 35px rgba(0,0,0,.1);
}

.icon {
  width: 70px;
  height: 70px;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #111;
  color: white;

  font-size: 35px;

  margin-bottom: 20px;
}

.game h2 {
  margin: 0 0 8px;
}

.game p {
  margin: 0;
  color: #777;
  line-height: 1.5;
}

.play {
  display: inline-block;

  margin-top: 20px;

  background: #111;
  color: white;

  padding: 11px 18px;

  border-radius: 10px;

  font-weight: 800;
}

@media(max-width:750px) {

  header {
    padding: 0 15px;
  }

  nav {
    display: none;
  }

  .games {
    grid-template-columns: 1fr;
  }

  .hero {
    padding: 30px;
  }

  .hero h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
JEUFREX
</a>

<nav>
<a href="index.html">Ana Sayfa</a>
<a href="games.html">🎮 Oyunlar</a>
<a href="music.html">🎵 Müzik</a>
<a href="videos.html">🎬 Videolar</a>
<a href="community.html">👥 Topluluk</a>
<a href="explore.html">✨ Keşfet</a>
</nav>

</header>

<main>

<section class="hero">

<h1>🎮 JEUFREX Games</h1>

<p>
JEUFREX için kendi geliştirdiğimiz oyunlar.
Yeni oyunlar yakında burada! 🚀
</p>

</section>

<section class="games">

<a href="runner.html" class="game">

<div class="icon">
🏃
</div>

<h2>JEUFREX Runner</h2>

<p>
Engellerden kaç, coinleri topla ve kendi rekorunu kır!
</p>

<span class="play">
▶ Oyna
</span>

</a>

</section>

</main>

</body>
</html>
