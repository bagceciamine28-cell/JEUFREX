<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Flip | JEUFREX</title><style>body{margin:0;background:#080814;color:#fff;font:16px Arial;text-align:center}main{max-width:700px;margin:30px auto;padding:20px}canvas{width:100%;background:#111126;border-radius:25px}.b{padding:13px 22px;border:0;border-radius:12px;font-weight:bold}</style><main><h1>🌀 Gravity Flip</h1><p>Yerçekimini değiştir, engelleri aş!</p><canvas id="c" width="700" height="400"></canvas><p id="s">Skor: 0</p><button class="b" onclick="start()">Başlat</button></main><script>let c=document.querySelector('#c'),x=c.getContext('2d'),y=200,v=0,g=1,run=0,score=0;function start(){y=200;v=0;g=1;score=0;run=1;loop()}addEventListener('keydown',e=>{if(e.code==='Space'){g*=-1;v=0}});c.onclick=()=>{g*=-1;v=0};function loop(){x.fillStyle='#111126';x.fillRect(0,0,700,400);x.fillStyle='#ff5ca8';x.fillRect(80,y,30,30);x.fillStyle='#685cff';let ox=700-(score%620);x.fillRect(ox,0,35,110);x.fillRect(ox,290,35,110);v+=.5*g;y+=v;score++;document.querySelector('#s').textContent='Skor: '+Math.floor(score/10);if(y<0||y>370||ox<110&&ox>50&&(y<110||y>260)){run=0;alert('💥 Oyun bitti! Skor: '+Math.floor(score/10));return}requestAnimationFrame(loop)}</script>
