<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol | JEUFREX</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #171717;
    }

    .box {
      width: min(430px, calc(100% - 32px));
      background: white;
      padding: 34px;
      border: 1px solid #e5e5e8;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.07);
    }

    .logo {
      text-align: center;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dcdce2;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #171717;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #171717;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }

    .login a {
      color: #171717;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">JEUFREX</div>

    <div class="subtitle">
      Hesabını oluştur ve keşfetmeye başla.
    </div>

    <form id="registerForm">

      <label for="name">Ad</label>
      <input
        id="name"
        type="text"
        maxlength="50"
        placeholder="Adın"
        required
      >

      <label for="username">Kullanıcı adı</label>
      <input
        id="username"
        type="text"
        maxlength="30"
        placeholder="@kullaniciadi"
        required
      >

      <label for="email">E-posta</label>
      <input
        id="email"
        type="email"
        placeholder="ornek@gmail.com"
        required
      >

      <label for="password">Şifre</label>
      <input
        id="password"
        type="password"
        minlength="8"
        placeholder="En az 8 karakter"
        required
      >

      <button id="registerButton" type="submit">
        Kayıt Ol
      </button>

      <div id="message"></div>

    </form>

    <div class="login">
      Zaten hesabın var mı?
      <a href="login.html">Giriş Yap</a>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://cqxxobmvycesunyxicjj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_C0BYpv-9sknEu1EXbeKLwQ_lMddpL5V";

    const { createClient } =
      supabase;

    const client = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.textContent = text;
      message.style.background = success ? "#e9f8ee" : "#fff0f0";
      message.style.color = success ? "#176b35" : "#a30000";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      let username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!username.startsWith("@")) {
        username = "@" + username;
      }

      if (!/^@[a-zA-Z0-9_.-]{3,29}$/.test(username)) {
        showMessage(
          "Kullanıcı adı 3-29 karakter olmalı ve sadece harf, rakam, _, . veya - içermeli."
        );
        return;
      }

      if (password.length < 8) {
        showMessage("Şifren en az 8 karakter olmalı.");
        return;
      }

      button.disabled = true;
      button.textContent = "Hesap oluşturuluyor...";

      try {

        const { data, error } =
          await client.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                username: username,
                display_name: name
              }
            }
          });

        if (error) {
          throw error;
        }

        showMessage(
          "Hesabın oluşturuldu! E-posta doğrulaması gerekiyorsa gelen kutunu kontrol et.",
          true
        );

        form.reset();

      } catch (error) {

        showMessage(
          error.message || "Kayıt sırasında bir hata oluştu."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Kayıt Ol";

      }
    });
  </script>

</body>
</html>
