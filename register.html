<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol | JEUFREX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #171717;
    }

    .register-box {
      width: min(430px, calc(100% - 32px));
      background: white;
      padding: 34px;
      border: 1px solid #e5e5e8;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.07);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dcdce2;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #171717;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #171717;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }

    .login a {
      color: #171717;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="register-box">

    <div class="logo">JEUFREX</div>

    <div class="subtitle">
      Hesabını oluştur ve keşfetmeye başla.
    </div>

    <form>

      <label for="name">Ad</label>
      <input
        id="name"
        type="text"
        placeholder="Adın"
        required
      >

      <label for="username">Kullanıcı adı</label>
      <input
        id="username"
        type="text"
        placeholder="@kullaniciadi"
        required
      >

      <label for="email">E-posta</label>
      <input
        id="email"
        type="email"
        placeholder="ornek@gmail.com"
        required
      >

      <label for="password">Şifre</label>
      <input
        id="password"
        type="password"
        placeholder="Şifren"
        minlength="8"
        required
      >

      <button type="submit">
        Kayıt Ol
      </button>

    </form>

    <div class="login">
      Zaten hesabın var mı?
      <a href="login.html">Giriş Yap</a>
    </div>

  </main>

</body>
</html>
