<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Paneli | JEUFREX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      min-height: 70px;
      padding: 0 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
    }

    .back {
      color: #ddd;
      text-decoration: none;
      font-weight: 700;
    }

    main {
      width: min(1100px, calc(100% - 30px));
      margin: 35px auto;
    }

    h1 {
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,.05);
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .user-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .user {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: .15s;
    }

    .user:hover {
      background: #f7f7f7;
    }

    .user.selected {
      border-color: #111;
      background: #f2f2f2;
    }

    .user-name {
      font-weight: 900;
      margin-bottom: 4px;
    }

    .user-username {
      color: #777;
      font-size: 13px;
    }

    label {
      display: block;
      font-weight: 800;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      background: #111;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button.danger {
      background: #c62828;
    }

    button.admin {
      background: #6d28d9;
    }

    button.secondary {
      background: #eee;
      color: #111;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .status {
      margin-top: 20px;
      padding: 13px;
      border-radius: 12px;
      display: none;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px 10px;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      margin-right: 5px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #eee;
      font-size: 11px;
      font-weight: 800;
    }

    .badge.admin {
      background: #eadcff;
      color: #5b21b6;
    }

    .badge.banned {
      background: #ffe0e0;
      color: #a00000;
    }

    .badge.id {
      background: #e8f0ff;
      color: #2454a6;
    }

    .danger-zone {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #eee;
    }

    .danger-zone h3 {
      color: #b71c1c;
      margin-top: 0;
    }

    .delete-warning {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    JEUFREX 👑
  </a>

  <a href="profile.html" class="back">
    Profile Dön
  </a>

</header>


<main>

  <h1>👑 Admin Paneli</h1>

  <div class="grid">

    <!-- KULLANICILAR -->

    <section class="card">

      <h2>👥 Kullanıcılar</h2>

      <input
        id="search"
        class="search"
        type="text"
        placeholder="Kullanıcı ara..."
      >

      <div
        id="userList"
        class="user-list"
      >
        <div class="empty">
          Kullanıcılar yükleniyor...
        </div>
      </div>

    </section>


    <!-- YÖNETİM -->

    <section class="card">

      <div
        id="editorEmpty"
        class="empty"
      >
        Düzenlemek için soldan bir kullanıcı seç.
      </div>


      <div
        id="editor"
        style="display:none;"
      >

        <h2>✏️ Kullanıcı Yönetimi</h2>


        <label>
          Görünen Ad
        </label>

        <input
          id="displayName"
          type="text"
          placeholder="Görünen ad"
        >


        <label>
          Kullanıcı Adı
        </label>

        <input
          id="username"
          type="text"
          placeholder="@kullanici"
        >


        <label>
          Biyografi
        </label>

        <textarea
          id="bio"
          placeholder="Biyografi"
        ></textarea>


        <div class="actions">

          <button id="saveButton">
            💾 Değişiklikleri Kaydet
          </button>

          <button
            id="profileButton"
            class="secondary"
          >
            👤 Profili Gör
          </button>

        </div>


        <div class="actions">

          <button
            id="banButton"
            class="danger"
          >
            🚫 Banla
          </button>

          <button
            id="adminButton"
            class="admin"
          >
            👑 Admin Yap
          </button>

        </div>


        <!-- TEHLİKELİ İŞLEMLER -->

        <div class="danger-zone">

          <h3>⚠️ Tehlikeli İşlemler</h3>

          <p class="delete-warning">
            Hesap silme işlemi kalıcıdır. Kullanıcının
            giriş hesabı ve profili silinir. Bu işlem
            geri alınamaz.
          </p>

          <button
            id="deleteButton"
            class="danger"
          >
            🗑️ Hesabı Kalıcı Olarak Sil
          </button>

        </div>


        <div
          id="status"
          class="status"
        ></div>

      </div>

    </section>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://cqxxobmvycesunyxicjj.supabase.co";


  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeHhvYm12ZWNlc3VueXhpY2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTQ3MzIsImV4cCI6MjEwMzIzMDczMn0.dzHRAvnBUf_sSkOFVrCCmuutG0RVzaxvxTjsEPSw0vk";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENTLER
  // ==========================================

  const userList =
    document.getElementById("userList");

  const search =
    document.getElementById("search");

  const editor =
    document.getElementById("editor");

  const editorEmpty =
    document.getElementById("editorEmpty");

  const displayName =
    document.getElementById("displayName");

  const username =
    document.getElementById("username");

  const bio =
    document.getElementById("bio");

  const saveButton =
    document.getElementById("saveButton");

  const profileButton =
    document.getElementById("profileButton");

  const banButton =
    document.getElementById("banButton");

  const adminButton =
    document.getElementById("adminButton");

  const deleteButton =
    document.getElementById("deleteButton");

  const status =
    document.getElementById("status");


  let users = [];

  let selectedUser = null;

  let currentAdmin = null;


  // ==========================================
  // DURUM MESAJI
  // ==========================================

  function showStatus(
    text,
    success = true
  ) {

    status.style.display = "block";

    status.textContent = text;

    status.style.background =
      success
        ? "#e9f8ee"
        : "#fff0f0";

    status.style.color =
      success
        ? "#176b35"
        : "#a00000";
  }


  // ==========================================
  // ADMIN KONTROLÜ
  // ==========================================

  async function checkAdmin() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      window.location.href =
        "login.html";

      return false;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("is_admin")
        .eq("id", user.id)
        .maybeSingle();


    if (
      error ||
      !data ||
      data.is_admin !== true
    ) {

      alert(
        "Bu sayfaya sadece adminler erişebilir."
      );

      window.location.href =
        "index.html";

      return false;
    }


    currentAdmin = user;

    return true;
  }


  // ==========================================
  // KULLANICILARI GETİR
  // ==========================================

  async function loadUsers() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, display_name, username, bio, is_admin, is_banned"
        )
        .order(
          "display_name",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      userList.innerHTML =
        `<div class="empty">
          Kullanıcılar alınamadı.<br><br>
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    users =
      data || [];


    renderUsers(users);
  }


  // ==========================================
  // KULLANICI LİSTESİ
  // ==========================================

  function renderUsers(list) {

    userList.innerHTML = "";


    if (!list.length) {

      userList.innerHTML =
        `<div class="empty">
          Kullanıcı bulunamadı.
        </div>`;

      return;
    }


    list.forEach(user => {

      const item =
        document.createElement("div");


      item.className =
        "user";


      if (
        selectedUser &&
        selectedUser.id === user.id
      ) {

        item.classList.add(
          "selected"
        );
      }


      item.innerHTML = `

        <div class="user-name">
          ${escapeHtml(
            user.display_name ||
            "Kullanıcı"
          )}
        </div>

        <div class="user-username">
          ${escapeHtml(
            user.username ||
            "@kullanici"
          )}
        </div>

        ${
          user.is_admin
            ? `
              <span class="badge admin">
                👑 ADMIN
              </span>
            `
            : ""
        }

        ${
          user.is_banned
            ? `
              <span class="badge banned">
                🚫 BANLI
              </span>
            `
            : ""
        }

      `;


      item.onclick =
        () => selectUser(user);


      userList.appendChild(item);

    });

  }


  // ==========================================
  // HTML GÜVENLİĞİ
  // ==========================================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // ==========================================
  // KULLANICI SEÇ
  // ==========================================

  function selectUser(user) {

    selectedUser =
      user;


    editorEmpty.style.display =
      "none";


    editor.style.display =
      "block";


    displayName.value =
      user.display_name || "";


    username.value =
      user.username || "";


    bio.value =
      user.bio || "";


    banButton.textContent =
      user.is_banned
        ? "✅ Banı Kaldır"
        : "🚫 Banla";


    adminButton.textContent =
      user.is_admin
        ? "⬇️ Adminliği Kaldır"
        : "👑 Admin Yap";


    // Kendi hesabını silme

    if (
      currentAdmin &&
      user.id === currentAdmin.id
    ) {

      deleteButton.disabled =
        true;

      deleteButton.textContent =
        "🔒 Kendi Hesabın";

    } else {

      deleteButton.disabled =
        false;

      deleteButton.textContent =
        "🗑️ Hesabı Kalıcı Olarak Sil";

    }


    profileButton.onclick =
      function() {

        const clean =
          (user.username || "")
            .replace("@", "");


        window.location.href =
          "profile.html?user=" +
          encodeURIComponent(clean);

      };


    renderUsers(
      getFilteredUsers()
    );


    status.style.display =
      "none";

  }


  // ==========================================
  // ARAMA
  // ==========================================

  function getFilteredUsers() {

    const query =
      search.value
        .trim()
        .toLowerCase();


    if (!query) {

      return users;

    }


    return users.filter(user => {

      return (

        (user.display_name || "")
          .toLowerCase()
          .includes(query)

        ||

        (user.username || "")
          .toLowerCase()
          .includes(query)

      );

    });

  }


  search.addEventListener(
    "input",
    function() {

      renderUsers(
        getFilteredUsers()
      );

    }
  );


  // ==========================================
  // PROFİLİ KAYDET
  // ==========================================

  saveButton.onclick =
    async function() {

      if (!selectedUser) {
        return;
      }


      saveButton.disabled =
        true;


      saveButton.textContent =
        "Kaydediliyor...";


      let newUsername =
        username.value.trim();


      if (!newUsername) {

        showStatus(
          "Kullanıcı adı boş bırakılamaz.",
          false
        );

        saveButton.disabled =
          false;

        saveButton.textContent =
          "💾 Değişiklikleri Kaydet";

        return;
      }


      if (
        !newUsername.startsWith("@")
      ) {

        newUsername =
          "@" + newUsername;

      }


      const {
        data: existing,
        error: usernameError
      } =
        await supabaseClient
          .from("profiles")
          .select("id")
          .eq(
            "username",
            newUsername
          )
          .neq(
            "id",
            selectedUser.id
          )
          .maybeSingle();


      if (usernameError) {

        showStatus(
          "Kullanıcı adı kontrol edilemedi: " +
          usernameError.message,
          false
        );

        saveButton.disabled =
          false;

        saveButton.textContent =
          "💾 Değişiklikleri Kaydet";

        return;

      }


      if (existing) {

        showStatus(
          "Bu kullanıcı adı zaten kullanılıyor.",
          false
        );

        saveButton.disabled =
          false;

        saveButton.textContent =
          "💾 Değişiklikleri Kaydet";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .update({

            display_name:
              displayName.value.trim(),

            username:
              newUsername,

            bio:
              bio.value.trim()

          })
          .eq(
            "id",
            selectedUser.id
          )
          .select()
          .single();


      if (error) {

        console.error(error);

        showStatus(
          "Kaydetme başarısız: " +
          error.message,
          false
        );

      } else {

        selectedUser =
          data;


        users =
          users.map(user =>
            user.id === data.id
              ? data
              : user
          );


        renderUsers(
          getFilteredUsers()
        );


        showStatus(
          "✅ Kullanıcı bilgileri güncellendi."
        );

      }


      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 Değişiklikleri Kaydet";

    };


  // ==========================================
  // BAN
  // ==========================================

  banButton.onclick =
    async function() {

      if (!selectedUser) {
        return;
      }


      const newValue =
        !selectedUser.is_banned;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .update({
            is_banned: newValue
          })
          .eq(
            "id",
            selectedUser.id
          )
          .select()
          .single();


      if (error) {

        showStatus(
          "Ban işlemi başarısız: " +
          error.message,
          false
        );

        return;

      }


      selectedUser =
        data;


      users =
        users.map(user =>
          user.id === data.id
            ? data
            : user
        );


      banButton.textContent =
        data.is_banned
          ? "✅ Banı Kaldır"
          : "🚫 Banla";


      renderUsers(
        getFilteredUsers()
      );


      showStatus(
        data.is_banned
          ? "🚫 Kullanıcı banlandı."
          : "✅ Kullanıcının banı kaldırıldı."
      );

    };


  // ==========================================
  // ADMIN YAP / ADMINLİĞİ KALDIR
  // ==========================================

  adminButton.onclick =
    async function() {

      if (!selectedUser) {
        return;
      }


      if (
        selectedUser.id ===
        currentAdmin.id
      ) {

        showStatus(
          "Kendi admin yetkini buradan kaldıramazsın.",
          false
        );

        return;
      }


      const newValue =
        !selectedUser.is_admin;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .update({
            is_admin: newValue
          })
          .eq(
            "id",
            selectedUser.id
          )
          .select()
          .single();


      if (error) {

        showStatus(
          "Admin işlemi başarısız: " +
          error.message,
          false
        );

        return;

      }


      selectedUser =
        data;


      users =
        users.map(user =>
          user.id === data.id
            ? data
            : user
        );


      adminButton.textContent =
        data.is_admin
          ? "⬇️ Adminliği Kaldır"
          : "👑 Admin Yap";


      renderUsers(
        getFilteredUsers()
      );


      showStatus(
        data.is_admin
          ? "👑 Kullanıcı admin yapıldı."
          : "Admin yetkisi kaldırıldı."
      );

    };


  // ==========================================
  // HESAP SİLME
  // ==========================================

  deleteButton.onclick =
    async function() {

      if (!selectedUser) {
        return;
      }


      if (
        selectedUser.id ===
        currentAdmin.id
      ) {

        showStatus(
          "Kendi admin hesabını silemezsin.",
          false
        );

        return;

      }


      const name =
        selectedUser.display_name ||
        selectedUser.username ||
        "bu kullanıcı";


      const confirmed =
        confirm(
          `⚠️ DİKKAT!\n\n` +
          `"${name}" hesabını kalıcı olarak silmek istediğine emin misin?\n\n` +
          `Bu işlem kullanıcının giriş hesabını ve profilini siler ve geri alınamaz.`
        );


      if (!confirmed) {
        return;
      }


      const secondConfirm =
        confirm(
          `Son onay:\n\n` +
          `"${name}" hesabı GERİ ALINAMAZ şekilde silinecek.\n\n` +
          `Devam edilsin mi?`
        );


      if (!secondConfirm) {
        return;
      }


      deleteButton.disabled =
        true;


      deleteButton.textContent =
        "🗑️ Siliniyor...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.functions.invoke(
            "admin-delete-user",
            {
              body: {
                user_id:
                  selectedUser.id
              }
            }
          );


        if (error) {

          console.error(error);

          throw new Error(
            error.message ||
            "Edge Function çalıştırılamadı."
          );

        }


        if (
          !data ||
          !data.success
        ) {

          throw new Error(
            data?.error ||
            "Kullanıcı silinemedi."
          );

        }


        const deletedId =
          selectedUser.id;


        users =
          users.filter(
            user =>
              user.id !== deletedId
          );


        selectedUser =
          null;


        editor.style.display =
          "none";


        editorEmpty.style.display =
          "block";


        renderUsers(
          getFilteredUsers()
        );


        showStatus(
          "✅ Kullanıcı hesabı kalıcı olarak silindi."
        );


      } catch (error) {

        console.error(error);

        showStatus(
          "Hesap silinemedi: " +
          error.message,
          false
        );

      }


      deleteButton.disabled =
        false;


      deleteButton.textContent =
        "🗑️ Hesabı Kalıcı Olarak Sil";

    };


  // ==========================================
  // BAŞLAT
  // ==========================================

  async function start() {

    const allowed =
      await checkAdmin();


    if (!allowed) {
      return;
    }


    await loadUsers();

  }


  start();

</script>

</body>
</html>
```
