<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keşfet | JEUFREX</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#060611;color:#fff;font-family:Inter,Arial,sans-serif}body:before{content:"";position:fixed;inset:-30%;z-index:-1;background:radial-gradient(circle at 15% 15%,#7658ff55,transparent 25%),radial-gradient(circle at 85% 20%,#ff4d9150,transparent 25%),radial-gradient(circle at 50% 90%,#4de7ff25,transparent 25%);filter:blur(14px);animation:bg 16s ease-in-out infinite alternate}@keyframes bg{to{transform:translate(6%,5%) scale(1.12)}}header{position:sticky;top:0;z-index:10;padding:16px 35px;display:flex;justify-content:space-between;align-items:center;background:#070711dd;border-bottom:1px solid #ffffff12;backdrop-filter:blur(24px)}.logo{color:#fff;text-decoration:none;font-size:25px;font-weight:950}nav{display:flex;gap:20px}nav a{color:#aaa;text-decoration:none;font-size:14px;font-weight:800}nav a:hover,nav a.active{color:#fff}main{width:min(1100px,calc(100% - 30px));margin:auto;padding:42px 0}.panel{padding:25px;border:1px solid #ffffff14;border-radius:28px;background:#ffffff09;backdrop-filter:blur(25px);box-shadow:0 25px 80px #0007}.hero h1{font-size:clamp(42px,7vw,70px);margin:15px 0 8px;letter-spacing:-4px;background:linear-gradient(90deg,#fff,#cfc5ff,#ff9fc3);-webkit-background-clip:text;color:transparent}.hero p{color:#aaa;line-height:1.6}.badge{display:inline-block;padding:8px 13px;border:1px solid #ffffff15;border-radius:999px;font-size:11px;font-weight:900}.search{display:flex;gap:10px;margin-top:25px}.search input{flex:1;padding:16px 18px;border:1px solid #ffffff16;border-radius:16px;outline:0;background:#ffffff09;color:#fff;font-size:15px}.search button,.quick button{border:0;border-radius:14px;padding:0 22px;background:linear-gradient(135deg,#7c5cff,#ff4d91);color:#fff;font-weight:900;cursor:pointer}.quick{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}.quick button{padding:9px 13px;background:#ffffff0b;border:1px solid #ffffff12;font-size:11px}.results{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}.card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid #ffffff12;border-radius:20px;background:#ffffff09;cursor:pointer;transition:.25s;animation:in .35s both}.card:hover{transform:translateY(-4px);background:#ffffff12}.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#ff4d91);font-size:23px;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.info{min-width:0}.username{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.display{margin-top:4px;color:#aaa;font-size:12px}.sub{margin-top:4px;color:#777;font-size:11px}.empty{grid-column:1/-1;text-align:center;padding:40px;color:#888;border:1px dashed #ffffff18;border-radius:18px}.error{color:#ffb5b5;background:#ff464612}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:600px){header{padding:13px 16px}nav{display:none}.hero{padding:22px}.search{flex-direction:column}.search button{padding:14px}}
</style></head><body><header><a class="logo" href="index.html">JEUFREX</a><nav><a href="index.html">Ana Sayfa</a><a href="games.html">🎮 Oyunlar</a><a href="music.html">🎵 Müzik</a><a href="videos.html">🎬 Videolar</a><a href="community.html">👥 Topluluk</a><a class="active" href="explore.html">✨ Keşfet</a></nav></header><main><section class="panel hero"><span class="badge">✨ JEUFREX EXPLORE</span><h1>Keşfet</h1><p>Kullanıcı adı veya görünen ad ile gerçek JEUFREX profillerini bul.</p><div class="search"><input id="search" placeholder="🔎 Kullanıcı adı veya ad ara..." maxlength="50" autocomplete="off"><button id="go">Ara</button></div><div class="quick"><button id="random">🎲 Rastgele kullanıcı</button><button onclick="location.href='games.html'">🎮 Oyunlar</button><button onclick="location.href='music.html'">🎵 Müzik</button></div></section><section class="panel" style="margin-top:20px"><h2 id="title">👥 Kullanıcı keşfi</h2><div id="results" class="results"><div class="empty">🔎 Aramak için yukarıya bir kullanıcı adı yaz.</div></div></section></main><script>const URL='https://cqxxobmvycesunyxicjj.supabase.co',KEY='sb_publishable_C0BYpv-9sknEu1EXbeKLwQ_lMddpL5V',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function clean(v){return v.trim().replace(/^@/,'').replace(/[%]/g,'')}function profile(p){if(!p.username)return;location.href='profile.html?user='+encodeURIComponent(p.username)}function render(rows){const box=$('results');if(!rows?.length){box.innerHTML='<div class="empty">👤 Kullanıcı bulunamadı.</div>';return}box.innerHTML='';rows.forEach((p,i)=>{const u=p.username||'',n=p.display_name||'',photo=p.avatar_url||'';const card=document.createElement('article');card.className='card';card.style.animationDelay=i*40+'ms';card.innerHTML=photo?`<div class="avatar"><img src="${esc(photo)}" alt=""></div>`:`<div class="avatar">${esc((n||u||'?').charAt(0).toUpperCase())}</div>`;card.innerHTML+=`<div class="info"><div class="username">@${esc(u.replace(/^@/,''))}</div>${n?`<div class="display">${esc(n)}</div>`:''}<div class="sub">JEUFREX kullanıcısı</div></div>`;card.onclick=()=>profile(p);box.appendChild(card)})}async function searchUsers(){const q=clean($('search').value);if(!q){$('results').innerHTML='<div class="empty">🔎 Bir kullanıcı adı veya ad yaz.</div>';return}$('title').textContent='🔎 Arama sonuçları';$('results').innerHTML='<div class="empty">🔍 Aranıyor...</div>';try{const pattern='%'+q+'%';const r=await db.from('profiles').select('id,username,display_name,avatar_url').or(`username.ilike.${pattern},display_name.ilike.${pattern}`).limit(30);if(r.error)throw r.error;render(r.data)}catch(e){console.error(e);$('results').innerHTML='<div class="empty error">❌ Arama başarısız.<br><small>'+esc(e.message)+'</small></div>'}}async function randomUser(){try{const r=await db.from('profiles').select('id,username,display_name,avatar_url').not('username','is',null).limit(100);if(r.error)throw r.error;if(!r.data?.length)throw Error('Kullanıcı bulunamadı');profile(r.data[Math.floor(Math.random()*r.data.length)])}catch(e){$('results').innerHTML='<div class="empty error">❌ Kullanıcılar yüklenemedi.</div>'}}$('go').onclick=searchUsers;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchUsers()}};$('random').onclick=randomUser;</script></body></html>
